l_simp_chinese:
 # 自定义游戏规则分组与选项
 RULE_GROUP_ME_EAI:0 "Expert AI for Magna Europa（强人工智能）"
 ME_EAI_DIFFICULTY_RULE_NAME:0 "Expert AI：全局难度档位"
 ME_EAI_DIFF_STANDARD_TEXT:0 "标准档（零作弊 — 推荐）"
 ME_EAI_DIFF_STANDARD_DESC:0 "100% 公平高难，AI 没有任何隐藏数值加成。全部压迫感均来自精细优化的历史国策顺序、Meta 陆空海装备蓝图、后勤精锐编制、动态产线闭环、情报合作政府与 CSR 铁路枢纽超级会战指挥。"
 ME_EAI_DIFF_CHALLENGING_TEXT:0 "挑战档（+15% 工业与后勤）"
 ME_EAI_DIFF_CHALLENGING_DESC:0 "为第一、二梯队 AI 国家提供温和的工业与后勤强化（+15% 工厂产出、+15% 建造速度、+10% 科研速度、-10% 补给消耗、+15% 组织度恢复、+15% 计划速度），不附带直接攻防数值作弊。"
 ME_EAI_DIFF_BRUTAL_TEXT:0 "残酷档（+30% 工业与 +10% 攻防）"
 ME_EAI_DIFF_BRUTAL_DESC:0 "面向老兵玩家的 Expert AI 5.0 风格战争机器（+30% 工厂产出、+25% 建造速度、+20% 科研速度、-20% 补给消耗、-15% 损耗、+25% 组织度恢复、+10% 陆军攻防、+25% 人力修正）。"
 ME_EAI_DIFF_CUSTOM_TEXT:0 "自定义（开局局内配置）"
 ME_EAI_DIFF_CUSTOM_DESC:0 "以零作弊标准档开局，并在第 1 天立即弹出局内难度与阵营定向强化配置菜单。"

 ME_EAI_BLOC_FOCUS_RULE_NAME:0 "Expert AI：阵营定向强化"
 ME_EAI_BLOC_NONE_TEXT:0 "无（阵营对称）"
 ME_EAI_BLOC_NONE_DESC:0 "不对任何特定阵营施加额外强化，保持完全公平对称。"
 ME_EAI_BLOC_AXIS_TEXT:0 "强化轴心主要国（德 / 意 / 匈 / 罗 / 芬）"
 ME_EAI_BLOC_AXIS_DESC:0 "为轴心国主要 AI 施加定向工业、后勤与作战强化（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防），适合玩家扮演苏联、英国或美国时使用。"
 ME_EAI_BLOC_COMINTERN_TEXT:0 "强化苏联（SOV）"
 ME_EAI_BLOC_COMINTERN_DESC:0 "为 AI 苏联施加「红色风暴」定向强化（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防、+15% 人力），适合玩家扮演德国或轴心国挑战高难东线。"
 ME_EAI_BLOC_ALLIES_TEXT:0 "强化同盟主要国（英 / 美 / 法）"
 ME_EAI_BLOC_ALLIES_DESC:0 "为同盟国主要 AI 施加定向工业与登陆压迫强化（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防），适合玩家扮演德国或意大利时使用。"
 ME_EAI_BLOC_ANTI_PLAYER_TEXT:0 "动态强化玩家敌对大国"
 ME_EAI_BLOC_ANTI_PLAYER_DESC:0 "自动为所有与人类玩家不在同一阵营的第一梯队 AI 大国施加定向强化，且绝不膨胀你的友军 AI。"

 ME_EAI_DIVISION_CAPS_RULE_NAME:0 "Expert AI：师团软上限（性能优化）"
 ME_EAI_CAPS_ON_TEXT:0 "开启（适配 ME 2–2.5× 战线 — 推荐）"
 ME_EAI_CAPS_ON_DESC:0 "按《Magna Europa》大地图战线比例实施步兵与装甲师软上限，杜绝后期填线卡顿，并将富余产能自动导入现代战斗机、密接支援机与重型中坦集群。"
 ME_EAI_CAPS_RELAXED_TEXT:0 "放宽（+25% 上限）"
 ME_EAI_CAPS_RELAXED_DESC:0 "将所有 AI 师团软上限提高 25%，适合高配 CPU 玩家体验更密集的 1942–45 年超级会战。"
 ME_EAI_CAPS_OFF_TEXT:0 "关闭（不设上限）"
 ME_EAI_CAPS_OFF_DESC:0 "完全关闭师团软上限，后期帧率可能明显下降。"

 ME_EAI_RIVER_FORTS_RULE_NAME:0 "Expert AI：欧洲大河定向筑垒"
 ME_EAI_FORTS_ON_TEXT:0 "开启（仅战时定向大河防线）"
 ME_EAI_FORTS_ON_DESC:0 "AI 仅在真实战时威胁下，用真实民工沿欧洲 7 条大河（莱茵河、维斯瓦河、第聂伯河、伏尔加河、顿河、波河、多瑙河）修筑适度定向要塞，绝不战前「未卜先知」偷修防线。"
 ME_EAI_FORTS_OFF_TEXT:0 "关闭"
 ME_EAI_FORTS_OFF_DESC:0 "关闭脚本化大河筑垒，体验纯粹野战大纵深机动。"

 # 隐藏难度民族精神
 ME_EAI_diff_challenging_idea:0 "Expert AI：挑战档强化"
 ME_EAI_diff_challenging_idea_desc:0 "玩家主动开启的 AI 挑战档难度修正。"
 ME_EAI_diff_brutal_idea:0 "Expert AI：残酷档强化"
 ME_EAI_diff_brutal_idea_desc:0 "玩家主动开启的 AI 残酷档难度修正。"
 ME_EAI_bloc_boost_idea:0 "Expert AI：阵营定向强化"
 ME_EAI_bloc_boost_idea_desc:0 "玩家主动开启的特定阵营主要 AI 工业与作战强化。"

 # 局内控制面板决议分类与决议
 ME_EAI_config_category:0 "Expert AI：局内控制面板 (v0.1.0)"
 ME_EAI_config_category_desc:0 "§YExpert AI for Magna Europa: Reforged§!（v0.1.0）实时配置面板。默认§G标准档§!坚持零数值作弊；你可随时在此切换全局难度、阵营定向强化或大河筑垒开关，立即生效且无需重开存档。"
 ME_EAI_dec_open_difficulty_menu:0 "调整全局 AI 难度档位"
 ME_EAI_dec_open_difficulty_menu_desc:0 "在§G标准档（零作弊）§!、§Y挑战档（+15%）§!与§R残酷档（+30%）§!之间实时切换。"
 ME_EAI_dec_open_bloc_menu:0 "配置阵营定向强化"
 ME_EAI_dec_open_bloc_menu_desc:0 "实时开启或清除轴心、苏联、同盟或玩家敌对大国的定向工业与作战强化。"
 ME_EAI_dec_toggle_river_forts:0 "开关欧洲大河定向筑垒"
 ME_EAI_dec_toggle_river_forts_desc:0 "实时开启或关闭 AI 在 7 条欧洲大河战时使用民工修筑定向防线要塞的功能。"
 ME_EAI_dec_river_forts_enabled_tt:0 "§G欧洲大河定向筑垒已开启。§!"
 ME_EAI_dec_river_forts_disabled_tt:0 "§Y欧洲大河定向筑垒已关闭。§!"
 ME_EAI_dec_show_credits:0 "关于本模组与致敬 Expert AI 5.0"
 ME_EAI_dec_show_credits_desc:0 "查看核心架构说明、版本亮点及对 Expert AI 5.0 的致敬声明。"
 ME_EAI_dec_hide_panel:0 "隐藏 Expert AI 控制面板"
 ME_EAI_dec_hide_panel_desc:0 "将此决议分组从决议栏彻底隐藏，保持界面清爽（已选配置仍持续生效）。"
 ME_EAI_dec_hide_panel_tt:0 "§YExpert AI 控制面板已隐藏，当前配置继续生效。§!"

 # 事件文本
 ME_EAI_events.1.t:0 "Expert AI for Magna Europa: Reforged (v0.1.0)"
 ME_EAI_events.1.desc:0 "欢迎启用 §YExpert AI for Magna Europa: Reforged v0.1.0§! —— 专为《Magna Europa》2,986 州 / 253 战区欧洲大地图独立打造的独立高难 AI 子模组，向经典模组 §YExpert AI 5.0§! 的工程哲学致敬。\n\n§G默认标准档坚持零数值作弊，榨干原版全部机制：§!\n• §Y历史线四年计划德国：§! 赫斯→戈培尔→托特核心圈并借事件原地免费换施佩尔双吃、零损耗纯 2 骑镇压、法投降前全境抢黄金、100% 法苏合作政府与大西洋壁垒。\n• §Y钢铁洪流苏联：§! 零陆空随机大清洗（伪造报告 + 实在不行苦一苦海军）、1938–39 提前处决托洛茨基、自建合成橡胶彻底根治橡胶饥荒、红空军全线改革、乌拉尔西迁与斯大夫卡训练队列预备队。\n• §YCSR 图论作战大脑：§! 铁路枢纽超级会战、绿空 CAS 协同、意大利巴尔干/地中海陆海协同与 28 天错峰零卡顿调度。\n\n你可保持当前游戏规则，或在下方直接切换难度（局内亦可随时通过决议栏 §YExpert AI：局内控制面板§! 调整）。"
 ME_EAI_events.1.a:0 "沿用当前游戏规则（默认标准档：零数值作弊）"
 ME_EAI_events.1.a.tt:0 "§GExpert AI 已按当前游戏规则就绪（标准档 AI 无任何隐藏数值加成）。§!"
 ME_EAI_events.1.b:0 "立即切换至挑战档（+15% AI 工业与后勤）"
 ME_EAI_events.1.b.tt:0 "§Y挑战档已激活：§! 第一、二梯队 AI 获得 +15% 工厂产出、+15% 建造速度、+10% 科研、-10% 补给消耗与 +15% 组织度恢复。"
 ME_EAI_events.1.c:0 "立即切换至残酷档（+30% AI 工业与 +10% 攻防）"
 ME_EAI_events.1.c.tt:0 "§R残酷档已激活：§! 第一、二梯队 AI 获得 +30% 工厂产出、+25% 建造速度、+20% 科研、-20% 补给消耗、+10% 攻防与 +25% 人力。"
 ME_EAI_events.1.d:0 "配置阵营定向强化（轴心 / 苏联 / 同盟 / 敌对大国）"

 ME_EAI_events.2.t:0 "Expert AI：全局难度档位设置"
 ME_EAI_events.2.desc:0 "请选择作用于全部第一、二梯队 AI 国家的全局难度档位。切换后立即对全图生效，人类玩家永不获取 AI 难度加成。"
 ME_EAI_events.2.a:0 "标准档（零作弊 — 纯粹机制与战术博弈）"
 ME_EAI_events.2.a.tt:0 "§G标准档已激活：§! 已清除所有全局 AI 难度数值加成。"
 ME_EAI_events.2.b:0 "挑战档（+15% 工业与后勤）"
 ME_EAI_events.2.c:0 "残酷档（+30% 工业、+10% 攻防、+25% 人力）"
 ME_EAI_events.2.d:0 "取消（保留当前设置）"

 ME_EAI_events.3.t:0 "Expert AI：阵营定向强化"
 ME_EAI_events.3.desc:0 "你可以为指定的对手阵营单独施加定向工业、科研、后勤与作战强化（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防），在拉满对抗压力的同时避免友军 AI 过度膨胀。"
 ME_EAI_events.3.a:0 "无（阵营对称 — 清除所有定向强化）"
 ME_EAI_events.3.a.tt:0 "§G已清除全部阵营定向强化。§!"
 ME_EAI_events.3.b:0 "强化轴心主要国（德 / 意 / 匈 / 罗 / 芬）"
 ME_EAI_events.3.b.tt:0 "§Y轴心主要 AI 已强化§!（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防）。"
 ME_EAI_events.3.c:0 "强化苏联（SOV）"
 ME_EAI_events.3.c.tt:0 "§R苏联 AI 已强化§!（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防、+15% 人力）。"
 ME_EAI_events.3.d:0 "强化同盟主要国（英 / 美 / 法）"
 ME_EAI_events.3.d.tt:0 "§C同盟主要 AI 已强化§!（+20% 产出、+15% 建造、-10% 补给消耗、+5% 攻防）。"
 ME_EAI_events.3.e:0 "动态强化所有玩家敌对大国"
 ME_EAI_events.3.e.tt:0 "§O所有与玩家非同盟的第一梯队 AI 大国已动态强化！§!"

 ME_EAI_events.4.t:0 "关于 Expert AI for Magna Europa (v0.1.0)"
 ME_EAI_events.4.desc:0 "§YExpert AI for Magna Europa: Reforged — v0.1.0§!\n\n§Y致敬声明：§!\n本子模组明确致敬经典高难 AI 模组 §YExpert AI 5.0§! 的外置状态机、Meta 装备设计、标准编成、分角色师团上限、战区扇区指挥与情报动态反制思想，但全部脚本与地图数据均为《Magna Europa》完全独立重写。\n\n§Y核心工程特性：§!\n• 离线 CSR 地图图论编译器（2,986 州、253 战区、15,366 条陆地/海峡邻接边、13 作战扇区、7 条大河防线、5 条登陆走廊）。\n• 零 `meta_effect`、零小时级轮询、28 天错峰调度与纯 O(1) Flag 策略驱动。\n• 深度榨干原版机制：历史四年计划德国（托特→施佩尔双吃、全法抢黄金、合作政府）与钢铁洪流苏联（零陆空随机清洗、提前杀托洛茨基、合成橡胶厂、红空军改革、斯大夫卡训练队列预备队）。\n• 通过 `MER_EAI_enabled` 零冲突平滑接管本体脚本，可随时安全装卸。"
 ME_EAI_events.4.a:0 "明白，返回指挥部"
