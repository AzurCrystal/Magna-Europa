l_english:
 # Game Rules Group & Rules
 RULE_GROUP_ME_EAI:0 "Expert AI for Magna Europa"
 ME_EAI_DIFFICULTY_RULE_NAME:0 "Expert AI: Global Difficulty Tier"
 ME_EAI_DIFF_STANDARD_TEXT:0 "Standard (Zero-Cheat — Recommended)"
 ME_EAI_DIFF_STANDARD_DESC:0 "100% fair challenge with ZERO hidden AI stat modifiers. AI pressure comes purely from optimized historical focus orders, Meta land/air/naval equipment designs, supply-aware templates, dynamic deficit production loops, espionage collaborations, and precompiled CSR railway-hub operational warfare."
 ME_EAI_DIFF_CHALLENGING_TEXT:0 "Challenging (+15% AI Industry & Supply)"
 ME_EAI_DIFF_CHALLENGING_DESC:0 "Grants Tier-1 and Tier-2 AI nations moderate industrial and logistical bonuses (+15% Factory Output, +15% Construction Speed, +10% Research Speed, -10% Supply Consumption, +15% Org Regain, +15% Planning Speed) without raw attack/defense cheats."
 ME_EAI_DIFF_BRUTAL_TEXT:0 "Brutal (+30% AI Industry & Combat)"
 ME_EAI_DIFF_BRUTAL_DESC:0 "Relentless Expert AI 5.0-style war machine for veteran players (+30% Factory Output, +25% Construction Speed, +20% Research Speed, -20% Supply Consumption, -15% Attrition, +25% Org Regain, +10% Attack/Defense, +25% Manpower Factor)."
 ME_EAI_DIFF_CUSTOM_TEXT:0 "Custom (Configure In-Game)"
 ME_EAI_DIFF_CUSTOM_DESC:0 "Starts on the Zero-Cheat Standard baseline and immediately opens the in-game Difficulty & Bloc Configuration menu on Day 1."

 ME_EAI_BLOC_FOCUS_RULE_NAME:0 "Expert AI: Targeted Bloc Boost"
 ME_EAI_BLOC_NONE_TEXT:0 "None (Symmetric)"
 ME_EAI_BLOC_NONE_DESC:0 "No faction-specific bonus modifiers. Pure symmetric balance."
 ME_EAI_BLOC_AXIS_TEXT:0 "Boost Axis Majors (GER / ITA / HUN / ROM / FIN)"
 ME_EAI_BLOC_AXIS_DESC:0 "Grants Axis AI majors an extra industrial, research, supply, and combat edge (+20% Factory Output, +15% Construction, -10% Supply, +5% Attack/Defense). Ideal when playing USSR, UK, or USA."
 ME_EAI_BLOC_COMINTERN_TEXT:0 "Boost Soviet Union (SOV)"
 ME_EAI_BLOC_COMINTERN_DESC:0 "Grants AI USSR an extra industrial and operational boost (+20% Factory Output, +15% Construction, -10% Supply, +5% Attack/Defense, +15% Manpower). Ideal when playing Germany or Axis."
 ME_EAI_BLOC_ALLIES_TEXT:0 "Boost Allied Majors (ENG / USA / FRA)"
 ME_EAI_BLOC_ALLIES_DESC:0 "Grants Allied AI majors an extra industrial and amphibious-pressure boost (+20% Factory Output, +15% Construction, -10% Supply, +5% Attack/Defense). Ideal when playing Germany or Italy."
 ME_EAI_BLOC_ANTI_PLAYER_TEXT:0 "Boost Enemy-of-Player Majors (Dynamic)"
 ME_EAI_BLOC_ANTI_PLAYER_DESC:0 "Dynamically grants the Targeted Bloc Boost to all Tier-1 AI nations that are NOT allied with any human player."

 ME_EAI_DIVISION_CAPS_RULE_NAME:0 "Expert AI: Soft Division Caps (Performance)"
 ME_EAI_CAPS_ON_TEXT:0 "Enabled (Balanced ME 2-2.5x Scale — Recommended)"
 ME_EAI_CAPS_ON_DESC:0 "Enforces Magna Europa-scaled soft infantry & armor caps to prevent late-game lag bloat and redirect surplus factories into modern fighters, CAS, and medium tank divisions."
 ME_EAI_CAPS_RELAXED_TEXT:0 "Relaxed (+25% Cap)"
 ME_EAI_CAPS_RELAXED_DESC:0 "Raises all AI soft division caps by +25% for high-end CPUs seeking even denser 1942-45 battle lines."
 ME_EAI_CAPS_OFF_TEXT:0 "Disabled (Uncapped)"
 ME_EAI_CAPS_OFF_DESC:0 "Disables all soft division caps. May significantly reduce late-game performance."

 ME_EAI_RIVER_FORTS_RULE_NAME:0 "Expert AI: Historical Major-River Fortifications"
 ME_EAI_FORTS_ON_TEXT:0 "Enabled (Wartime-Only Oriented River Lines)"
 ME_EAI_FORTS_ON_DESC:0 "AI constructs modest, CIV-paid defensive river forts along 7 historical European river lines (Rhine, Vistula, Dnieper, Volga, Don, Po, Danube) strictly under active wartime threat — never pre-war psychic fortification."
 ME_EAI_FORTS_OFF_TEXT:0 "Disabled"
 ME_EAI_FORTS_OFF_DESC:0 "Disables scripted major-river fortification construction for pure open-field maneuver warfare."

 # Hidden Difficulty Ideas (localized in case inspected via console/tooltips)
 ME_EAI_diff_challenging_idea:0 "Expert AI: Challenging"
 ME_EAI_diff_challenging_idea_desc:0 "Opt-in Challenging difficulty modifier for AI nations."
 ME_EAI_diff_brutal_idea:0 "Expert AI: Brutal"
 ME_EAI_diff_brutal_idea_desc:0 "Opt-in Brutal difficulty modifier for AI nations."
 ME_EAI_bloc_boost_idea:0 "Expert AI: Targeted Bloc Boost"
 ME_EAI_bloc_boost_idea_desc:0 "Opt-in faction-focused industrial and operational boost for AI majors."

 # In-Game Control Panel Decision Category & Decisions
 ME_EAI_config_category:0 "Expert AI: Control Panel (v0.1.0)"
 ME_EAI_config_category_desc:0 "Live configuration panel for §YExpert AI for Magna Europa: Reforged§! (v0.1.0). Default §GStandard§! mode uses zero numerical cheats. You may adjust AI difficulty tiers, targeted bloc boosts, or river fortifications anytime without restarting."
 ME_EAI_dec_open_difficulty_menu:0 "Configure Global AI Difficulty"
 ME_EAI_dec_open_difficulty_menu_desc:0 "Switch AI difficulty live between §GStandard (Zero-Cheat)§!, §YChallenging (+15%)§!, and §RBrutal (+30%)§!."
 ME_EAI_dec_open_bloc_menu:0 "Configure Targeted Bloc Boost"
 ME_EAI_dec_open_bloc_menu_desc:0 "Apply or clear targeted industrial & operational boosts for Axis, Soviet Union, Allies, or Enemy-of-Player AI majors."
 ME_EAI_dec_toggle_river_forts:0 "Toggle Major-River Fortifications"
 ME_EAI_dec_toggle_river_forts_desc:0 "Enable or disable CIV-paid wartime river bunker construction across the 7 major European river lines."
 ME_EAI_dec_river_forts_enabled_tt:0 "§GHistorical Major-River Fortifications are now ENABLED.§!"
 ME_EAI_dec_river_forts_disabled_tt:0 "§YHistorical Major-River Fortifications are now DISABLED.§!"
 ME_EAI_dec_show_credits:0 "About & Expert AI 5.0 Tribute"
 ME_EAI_dec_show_credits_desc:0 "View architecture highlights, credits, and tribute to Expert AI 5.0."
 ME_EAI_dec_hide_panel:0 "Hide Expert AI Control Panel"
 ME_EAI_dec_hide_panel_desc:0 "Cleanly hides this decision category from your Decisions tab for the rest of the campaign."
 ME_EAI_dec_hide_panel_tt:0 "§YExpert AI Control Panel hidden. Your current settings remain fully active.§!"

 # Events
 ME_EAI_events.1.t:0 "Expert AI for Magna Europa: Reforged (v0.1.0)"
 ME_EAI_events.1.desc:0 "Welcome to §YExpert AI for Magna Europa: Reforged v0.1.0§! — an independent high-challenge AI overhaul purpose-built for Magna Europa's 2,986-state / 253-region European theater, paying explicit tribute to the engineering philosophy of §YExpert AI 5.0§!.\n\n§GZero-Cheat Standard Baseline:§!\n• §YGermany:§! Historical Four-Year Plan, Hess-Goebbels-Todt-Speer Inner Circle mastery, zero-bleed garrisons, all-France gold seizure, Collaboration Governments & Atlantic Wall.\n• §YSoviet Union:§! Zero Army/Air random purge discipline (Navy fallback), early Trotsky assassination, synthetic rubber independence, full Red Air Force reform, Urals evacuation & Stavka strategic reserves.\n• §YOperational Brain:§! Precompiled CSR railway-hub Super-Battles, green-air CAS coordination, Italy Balkans/Med synergy, and lag-free 28-day staggered state machine.\n\nYou may keep your Game Rules setting or adjust difficulty below (and anytime via the §YExpert AI: Control Panel§! decision tab)."
 ME_EAI_events.1.a:0 "Proceed with Current Game Rules (Standard Zero-Cheat Default)"
 ME_EAI_events.1.a.tt:0 "§GExpert AI active with your selected Game Rules (0% hidden AI stat cheats on Standard).§!"
 ME_EAI_events.1.b:0 "Switch to Challenging (+15% AI Industry & Supply)"
 ME_EAI_events.1.b.tt:0 "§YChallenging Difficulty active:§! Tier-1 & Tier-2 AI nations gain +15% Factory Output, +15% Construction, +10% Research, -10% Supply Use, and +15% Org Regain."
 ME_EAI_events.1.c:0 "Switch to Brutal (+30% AI Industry & +10% Combat)"
 ME_EAI_events.1.c.tt:0 "§RBrutal Difficulty active:§! Tier-1 & Tier-2 AI nations gain +30% Factory Output, +25% Construction, +20% Research, -20% Supply Use, +10% Attack/Defense, and +25% Manpower."
 ME_EAI_events.1.d:0 "Configure Targeted Bloc Boost (Axis / USSR / Allies / Anti-Player)"

 ME_EAI_events.2.t:0 "Expert AI: Global Difficulty Tier"
 ME_EAI_events.2.desc:0 "Select the active global difficulty tier for all Tier-1 and Tier-2 AI nations. Changes take effect immediately across the map; human players never receive AI difficulty modifiers."
 ME_EAI_events.2.a:0 "Standard (Zero-Cheat — Pure AI Mastery)"
 ME_EAI_events.2.a.tt:0 "§GStandard Difficulty active:§! All global AI difficulty bonuses removed."
 ME_EAI_events.2.b:0 "Challenging (+15% Industry & Logistics)"
 ME_EAI_events.2.c:0 "Brutal (+30% Industry, +10% Combat, +25% Manpower)"
 ME_EAI_events.2.d:0 "Cancel (Keep Current Setting)"

 ME_EAI_events.3.t:0 "Expert AI: Targeted Bloc Boost"
 ME_EAI_events.3.desc:0 "Optionally grant a targeted industrial, research, logistics, and combat boost (+20% Factory Output, +15% Construction, -10% Supply, +5% Attack/Defense) to a specific rival bloc without inflating your own AI allies."
 ME_EAI_events.3.a:0 "None (Symmetric — Clear All Bloc Boosts)"
 ME_EAI_events.3.a.tt:0 "§GAll targeted bloc boosts cleared.§!"
 ME_EAI_events.3.b:0 "Boost Axis Majors (GER / ITA / HUN / ROM / FIN)"
 ME_EAI_events.3.b.tt:0 "§YAxis AI Majors boosted§! (+20% Factory Output, +15% Construction, -10% Supply, +5% Combat)."
 ME_EAI_events.3.c:0 "Boost Soviet Union (SOV)"
 ME_EAI_events.3.c.tt:0 "§RSoviet Union AI boosted§! (+20% Factory Output, +15% Construction, -10% Supply, +5% Combat, +15% Manpower)."
 ME_EAI_events.3.d:0 "Boost Allied Majors (ENG / USA / FRA)"
 ME_EAI_events.3.d.tt:0 "§CAllied AI Majors boosted§! (+20% Factory Output, +15% Construction, -10% Supply, +5% Combat)."
 ME_EAI_events.3.e:0 "Boost All Enemy-of-Player Majors (Dynamic)"
 ME_EAI_events.3.e.tt:0 "§OAll non-allied Tier-1 AI Majors dynamically boosted!§!"

 ME_EAI_events.4.t:0 "About Expert AI for Magna Europa (v0.1.0)"
 ME_EAI_events.4.desc:0 "§YExpert AI for Magna Europa: Reforged — v0.1.0§!\n\n§YTribute & Credits:§!\nInspired by and paying tribute to §YExpert AI 5.0§! — its pioneering concepts of external state-machine control, Meta equipment blueprints, structured division templates, soft division caps, operational fronts, and intel counter-adaptation.\n\n§YEngineered from Scratch for Magna Europa:§!\n• Offline CSR Map Graph Compiler (2,986 states, 253 regions, 15,366 land/strait edges, 13 theaters, 7 river fort lines, 5 amphibious corridors).\n• Zero-`meta_effect`, zero hourly polling, 28-day staggered scheduler.\n• Deep vanilla mechanic mastery for Germany (4YP + Todt-to-Speer + All-France Gold + Collaborations) and USSR (Zero Army/Air random purge + early Trotsky + Synthetic Rubber + VVS Reform + Stavka Reserves).\n• Clean takeover via `MER_EAI_enabled` — zero base-mod file overwrites."
 ME_EAI_events.4.a:0 "Understood — Back to Command"
