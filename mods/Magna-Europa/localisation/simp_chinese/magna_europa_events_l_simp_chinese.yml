l_simp_chinese:
 MA_germany.1.t:0 "德国要求吞并"
 MA_germany.1.desc:0 "德国已要求吞并我们这个光荣的国家。如果我们接受这些要求，我们辉煌的文化很可能会被抹杀。我们可以尝试对法西斯威胁进行最后的抵抗，或者投降并被并入德意志国。选择权在我们手中。"
 MA_germany.1a:0 "接受他们的要求"
 MA_germany.1a.t:0 "列支敦士登屈服了"
 MA_germany.1a.desc:0 "这个小国接受了我们的要求，整合进程十分迅速，他们的所有公民都将成为德国人"
 MA_germany.1a.1:0 "很好"
 MA_germany.1b:0 "决不"
 MA_germany.1b.desc:0 "肮脏的列支敦士登人拒绝了我们的要求，他们将和自己的国家一起化为灰烬"
 MA_germany.1b.t:0 "列支敦士登抵抗"
 MA_germany.1b.1:0 "把他们烧个精光"
