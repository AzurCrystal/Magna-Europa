 credits.1.t:0 "欢迎来到 Magna Europa: Reloaded！"
 credits.1.d:0 "大家好，欢迎！我们是 Magna Europa: Reloaded 的mod团队。\n本mod是原版 Magna Europa 的官方续作；目标与原作相同：把标准的地球地图改造为仅限欧洲的地图（不要看美洲方块:TM:）。\n本mod的开发耗费了大量时间和精力，希望你们玩得开心！\n团队成员：\nEdouard_Saladier：项目负责人、主程序员及地图作者。\nLolloBlue96：地图制作、程序、全能modder。（也是常驻意大利人！-Lollo）\nFBKong：程序员，做了大量全能工作，基本上移植了全部原版内容。\nManic_Eraser_Cat：地图制作兼程序员，做了超——级多的全能工作。（这里可是团队最高产成员 -Lollo）\nJazzyHug：地区人口与类别工作。\nFriedrich Nietzsche：胜利点及全能工作。（本地精神分裂患者 -Lollo）\nTaro：胜利点及全能工作。（本地食人族 -Lollo）\nCpt_anarchy：胜利点工作及决议移植。\nkris!：编程协助。\ntan_mai.ke：旗帜制作、程序、全能modder。\nrlk：程序员，协助移植了工业内容。\njj,.：少量地区与天气工作。\nTaco Shark：本地化与杂项工作。\n特别感谢曾与我们共事一段时间的人们：旗帜工作者 Nymphosocialist 和 Chesman，胜利点工作者 Lechi，河流工作者 Lev，以及 BadmintonKombikorm：俄语本地化与瑞士国策树。"
 credits.1.a:0 "继续游戏"
 credits.2.t:0 "制作名单。"
 credits.2.d:0 "主题曲音乐：Predella Avant - X。\n我们要感谢以下mod：\nKaiserreich：教宗及意大利可释放政权领导人的肖像。\nAlpine：国名与 Alpine: Flags（作者 XanderWalrus）提供了大部分旗帜和国名。\nItalian Commanders (colored)（作者 sataves85）提供了许多意大利将领与海军将领的肖像。\n特别感谢我们的朋友 One-Eyed Dragon，他制作了许多我们获准使用的精美旗帜。\n非常感谢这些优秀的人们！"
 credits.2.a:0 "来玩 Hotfix300526 版本吧！"
