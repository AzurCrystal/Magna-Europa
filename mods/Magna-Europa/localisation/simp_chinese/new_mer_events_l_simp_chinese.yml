l_simp_chinese:
 germany.129.t:0 "[FROM.GetName]请求驻军援助"
 germany.129.d:0 "[FROM.GetName]请求我们协助保护其领土。通过双方通信我们得知，其领土内的游击队活动正急剧增加，派出所需兵力填补驻军缺口或许至关重要。"
 germany.129.a:0 "很好"
 germany.129.b:0 "我们一个人也抽不出来。"
 germany.130.t:0 "德国接受了我们的请求"
 germany.130.d:0 ""
 germany.130.a:0 "非常好"
 germany.131.t:0 "德国拒绝了我们的请求"
 germany.131.d:0 ""
 germany.131.a:0 "我们什么也做不了。"
 germany.132.t:0 "南斯拉夫发生反德政变！"
 germany.132.d:0 "南斯拉夫签署《三国同盟条约》的决定在国内外引发了巨大争议，也招致了讨厌的英国人对该国内政的干预。南斯拉夫国王彼得二世进军贝尔格莱德，推翻了我们的盟友政权。这简直不可接受！"
 germany.132.a:0 "我是个笨蛋AI，需要帮助才能开战"
 germany.132.b:0 "德国战争机器轰鸣启动"
 us_industry_relocation:0 "把工业迁往西海岸"
 mer_event.1.t:0 "日本人袭击了珍珠港"
 mer_event.1.desc:0 "就在今天，日本人发动突袭轰炸了我们的舰船。珍珠港真是一团糟。无论如何，是时候加入同盟国，用我们无与伦比的工业实力碾压德国了！"
 mer_event.1.a:0 "美利坚，好耶！加入同盟国"
 mer_event.1.b:0 "我们不能分心欧洲，必须先痛扁日本，不管欧洲"
 mer_event.2.t:0 "给协约国除下土"
 mer_event.2.desc:0 "自从法国被德国暴揍之后，这个“协约国”真是难绷得要命。它曾经还挺风光，但现在是真的丢人。不过，是时候修修它了，而我们正好想出了一个绝佳的点子！"
 mer_event.2.a:0 "于是，[Root.GetLeader]望向[GER.GetLeader]，说道：“是时候搞联合国了！”"
 mer_event.2.b:0 "算了，让英国人觉得他们还是主角吧"
 UNITED_NATION:0 "联合国"
 mer_event.3.t:0 "给英联邦除下土"
 mer_event.3.desc:0 "法国是我们的盟友，不是我们的奴隶。我们必须给同盟改个名字，好让它更贴切些……就像我们在1904年4月签署的那份“挚诚协定”一样。"
 mer_event.3.a:0 "“是时候搞挚诚协定了！”"
 mer_event.3.b:0 "算了吧，万一我们也被暴揍呢"
 ENTENTE_CORDIALE:0 "挚诚协定"
 mer_event.4.t:0 "爱尔兰自由邦的终结"
 mer_event.4.desc:0 "这个“爱尔兰自由邦”真是难绷得要命。说真的，太逊了，多谢你啊英国佬。不过，是时候修修它了，而我们正好想出了一个绝佳的点子！"
 mer_event.4.a:0 "英国佬去死！另外，咱们试试“中立”这玩意吧，瑞士人靠它发了财"
 mer_event.4.b:0 "英国佬去死！不过别担心兄弟，我们会留在你的同盟里"
 mer_event.5.t:0 "叙利亚请求吞掉阿拉维和德鲁兹山国家"
 mer_event.5.desc:0 "叙利亚民族集团近来一直在争取独立。但给他们独立就意味着德国又多一个潜在盟友。德国很烂，我们不烂，叙利亚也不该烂。他们请求我们作出让步，把那两个国家交给他们。"
 mer_event.5.a:0 "这个让步可以接受。"
 mer_event.5.b:0 "不——我的人造国家啊，我在地图上把它们涂得那么好看！"
 edo_news.1.t:0 "国会宣布对轴心国与日本开战！"
 edo_news.1.d:0 "美国国会两院均以宣布对轴心国及日本开战所需的多数票通过了正式动议。\n\n这一进展是在德国近期对美宣战、以及日本本月初袭击珍珠港之后到来的。\n\n美国的战争机器正在点火启动，而美国的重新参战唤醒了这头沉睡的巨人……"
 edo_news.1.a:0 "德国现在也加入到讨伐盎格鲁世界的圣战中了！"
 edo_news.1.b:0 "一个受欢迎的发展。"
 edo_news.1.c:0 "美国佬又一次“到那边去了”。"
 edo_news.2.t:0 "日本对荷属东印度开战！"
 edo_news.2.d:0 "在首都发生令人震惊的事态之后，消息不断从巴达维亚各使馆传出：在珍珠港遇袭之后，荷属东印度政府声援同盟国，正式宣布与日本帝国进入战争状态。总督通过广播公开宣布，荷兰“接受这一挑战，对日本帝国拿起武器”。\n\n宣战的消息已于今日由荷兰大使J.C.帕布斯特递交日本外务大臣东乡茂德。"
 edo_news.2.a:0 "时间会证明一切……"
 edo_news.3.t:0 "荷兰在东印度投降！"
 edo_news.3.d:0 "荷属东印度今天传来令人震惊的消息：在群岛接连惨败之后，总督与盟军荷兰总司令已同意向日本帝国军队正式投降。据报道，同盟国对荷兰投降妨碍了其在群岛继续作战的意愿大为恼火，但他们别无选择，只能服从。\n\n“我军遭受了惨重损失，因为我军已无力抵御敌人的空袭；他们已精疲力竭……愿上帝与我们同在。女王万岁！”这是特尔·波滕在投降广播中播出的内容。"
 edo_news.3.a:0 "对同盟国战事的一次重击！"
 edo_news.4.t:0 "裕仁宣布日本投降"
 edo_news.4.desc:0 "在太平洋经历了一场艰苦的战役、并研制出一种危险的新式武器之后，美国先后在8月6日和9日将这一武器——原子弹——投向了广岛和长崎两座城市。随后，天皇于今天向国民宣布了日本的投降。预计他随后将签署投降文书。\n\n“但如今战争已持续将近四年。尽管人人竭尽全力——陆海军将士英勇奋战、百官勤勉尽职、一亿国民竭诚奉献——战局并未朝着对日本有利的方向发展，世界大势也已完全转而对她不利。”这是天皇广播中的一句话。"
 edo_news.4.a:0 "好消息！"
 edo_news.4.b:0 "不幸的是，我们必须为保住东印度而战……"
 edo_news.4.c:0 "懦夫！他们居然先我们一步投降了！"
 edo_news.4.d:0 "有趣的进展……"
 mer_event.13.t:0 "马其顿边界"
 mer_event.13.desc:0 "作为与保加利亚达成协议、承认其主张的一部分，我们决定与保加利亚人谈判以调整这些主张，好让其他盟友也能分得一些土地。\n保加利亚对马其顿提出了主张，但我们究竟愿意放弃马其顿和塞尔维亚的多少土地？"
 mer_event.13.a:0 "马其顿和皮罗特，但不包括西马其顿。"
 mer_event.13.b:0 "马其顿和皮罗特，包括西马其顿。"
 mer_event.13.c:0 "我们爱保加利亚，给他们大战时期的占领区！"
 mer_event.14.t:0 "多布罗加边界"
 mer_event.14.desc:0 "接下来是多布罗加，其南部主要是保加利亚人，但北部人口构成复杂。我们应该让步多少？"
 mer_event.14.a:0 "只要南部。"
 mer_event.14.b:0 "大部分地区。"
 mer_event.15.t:0 "色雷斯与中马其顿边界"
 mer_event.15.desc:0 "接下来是希腊领土，保加利亚想要一段爱琴海海岸。我们愿意让出多大的爱琴海海岸线？"
 mer_event.15.a:0 "只要大部分色雷斯"
 mer_event.15.b:0 "色雷斯和中马其顿的大部"
 mer_event.15.c:0 "我们爱保加利亚，全给他们！"
 mer_event.16.t:0 "东色雷斯"
 mer_event.16.desc:0 "我们是否应该把保加利亚在第二次巴尔干战争后割让给土耳其的土地也承认为协议的一部分？"
 mer_event.16.a:0 "不。"
 mer_event.16.b:0 "是"
 mer_event.17.t:0 "最终敲定"
 mer_event.17.desc:0 "边界已经确认，谈判就此结束。是时候敲定方案并提交给保加利亚人了。"
 mer_event.17.a:0 "我们干得漂亮。"
 mer_event.18.t:0 "求助的呼声"
 mer_event.18.desc:0 "在第二捷克斯洛伐克共和国获得了相当大的自治权之后，下喀尔巴阡罗斯——如今叫喀尔巴阡-乌克兰——一直在相对地走自己的路。而如今捷克斯洛伐克决定解体，这个国家宣布独立了。然而匈牙利人正对我国虎视眈眈，我们必须向……请求保护国地位"
 mer_event.18.a:0 "……德国……"
 mer_event.19.t:0 "喀尔巴阡-乌克兰请求成为保护国"
 mer_event.19.desc:0 "这个位于前捷克斯洛伐克东部的相对较小的国家——喀尔巴阡-乌克兰人——发来请求，希望我们成为他们的保护者、担当他们的宗主，就像斯洛伐克那样。但这真的重要吗？"
 mer_event.19.a:0 "他们可以得到保护。"
 mer_event.19.b:0 "我们懒得管。"
 mer_event.20.t:0 "德国拒绝了"
 mer_event.20.desc:0 "德国拒绝让我们成为其保护国，而匈牙利如今已全面转入战争状态。"
 mer_event.20.a:0 "我们完蛋了。"
 mer_event.21.t:0 "处置喀尔巴阡-乌克兰"
 mer_event.21.desc:0 "喀尔巴阡鲁塞尼亚——正式名称为喀尔巴阡-乌克兰——曾寻求德国的保护。德国拒绝了，并让他们向我们臣服。他们显然不愿这么做，所以我们必须……"
 mer_event.21.a:0 "……立刻进攻！"
 mer_event.21.b:0 "……尊重他们的主权。"
 mer_event.22.t:0 "德国入场了"
 mer_event.22.d:0 "德国决定接受，成为我们的保护者。匈牙利的威胁就此烟消云散！"
 mer_event.22.a:0 "好耶——！"
 mer_event.23.t:0 "德国保护了喀尔巴阡-乌克兰"
 mer_event.23.d:0 "德国拒绝让我们通过喀尔巴阡-乌克兰获得与波兰的边界。这不可接受，我们该怎么向德国人传达？"
 mer_event.23.a:0 "一份抗议照会就足够了。"
 mer_event.23.b:0 "无所谓！什么都不做。"
 mer_event.24.t:0 "卡累利阿首轮谈判成功"
 mer_event.24.d:0 "芬兰接受了我们对卡累利阿的最初要求，不过我们可以乘势继续推进。凭借武力施压，也许芬兰人会让步，割让更多的卡累利阿？又或者我们应该信守承诺，把东卡累利阿的部分地区割让给他们。"
 mer_event.24.a:0 "我们必须信守承诺，我们手头的麻烦已经够多了。"
 mer_event.24.b:0 "乘胜追击！"
 mer_event.25.t:0 "[FROM.GetAdjective]索取更多卡累利阿"
 mer_event.25.d:0 "尽管我们已经就[195.GetName]以及边境缓冲问题与[FROM.GetAdjective]达成一致，他们却决定变本加厉地提出更多主张，要求将西卡累利阿的大部分据为己有，并拒绝任何领土补偿。从他们在我方边境集结兵力的架势来看，他们仍不会接受拒绝，而领土也尚未完成交换。我们该如何回应？"
 mer_event.26.d:0 "不知为何我们的势头延续了下去。芬兰人一反常态地同意割让更多卡累利阿，接受我方划定的新边界。"
 mer_event.26.a:0 "我们本来期望他们来打一仗……"
 DOD_hungary.500.t:0 "[HUN.GetNonIdeologyName]要求举行奥地利公投"
 DOD_hungary.500.d:0 "[HUN.GetLeader]在布达佩斯的演讲中要求，允许他的奥地利臣民回归他的统治。不过，作为和解的姿态，他公开表示奥地利人民应当有权自己作出这个选择。我们可以允许这场公投举行，以换取他们不再对我国领土提出主张的保证；我们也可以反对它。"
 DOD_hungary.500.a:0 "我们或许能在[HUN.GetLeader]身上找到一个宝贵的盟友"
 DOD_hungary.500.b:0 "我们过去与多瑙河帝国交战过多次，绝不能容许它复辟。"
 DOD_hungary.501.t:0 "全民公投遭到拒绝"
 DOD_hungary.501.d:0 "作为[AUS.GetNonIdeologyAdjective]独立的保证国，[ITA.GetLeader]反对我们提出的、让奥地利回归[HUN.GetLeader]统治的公投提案，称其为“对《圣日耳曼条约》的公然违反”，并表示不能冒险让我们日后卷土重来收复威尼西亚。这让我们陷入了棘手的境地。虽然我们可以通过军事力量强行推进主张，但那将使我们同时面对奥地利与意大利两国的军队。"
 DOD_hungary.501.a:0 "我们不能退缩！拿起武器！"
 DOD_hungary.501.b:0 "我们赢不了这样的战争。我们必须放弃这些主张。"
 sic_communism_event.1.t:0 "与中国共产党人的接触"
 sic_communism_event.1.d:0 "我们的特工成功与中国共产党的代表取得了联系。他们对与西西里建立关系表现出兴趣，将我们视为全球反帝斗争中潜在的盟友。他们提出以情报和资源交换，换取我们支持他们对国民党政府的斗争。"
 sic_communism_event.1.a:0 "欢迎我们的新同志。"
 sic_communism_event.2.t:0 "来自中国的邀请"
 sic_communism_event.2.d:0 "中国共产党人发出了深化合作的正式邀请。他们提议建立一个包含军事援助和技术共享的战略同盟。然而，这一举动没有逃过意大利政府的眼睛，他们将其视为对其地中海利益的直接威胁。"
 sic_communism_event.2.a:0 "接受同盟，直面意大利的怒火。"
 sic_communism_event.2.b:0 "暂时婉拒，但留有余地。"
 sic_communism_event.3.t:0 "第三次会晤"
 sic_communism_event.3.d:0 "我们与中国共产党人持续的合作已经结出硕果。他们现在提议更深层次的整合：以人力和工业支持为交换，换取我们对其事业的承诺。这将极大地巩固我们的地位，但也会让我们更深地绑定在他们的革命议程上。"
 sic_communism_event.3.a:0 "全身心地拥抱这段伙伴关系。"
 sic_communism_event.4.t:0 "共产主义接管"
 sic_communism_event.4.d:0 "我们与中国共产党人同盟的高潮已经到来。通过周密的谋划与相互支持，我们已经走到可以宣告一个全新的共产主义帝国诞生的地步。这标志着西西里及其盟友的新纪元的开始。"
 sic_communism_event.4.a:0 "革命万岁！"
