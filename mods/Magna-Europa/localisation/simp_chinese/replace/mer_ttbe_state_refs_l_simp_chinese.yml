l_simp_chinese:

# Remapped Vanilla state IDs in To The Bitter End loc keys -> Magna Europa state IDs
 BA_romania.1.d: "早在1924年，苏联当局便在[2038.GetName]建立了摩尔达维亚苏维埃社会主义自治共和国，尽管该地区以乌克兰裔人口为主。这一举措显然旨在为其对[ROM.GetAdjective]摩尔达维亚的领土主张提供依据，如今已促使[FROM.GetNameDef]要求我方割让被划入摩尔达维亚苏维埃社会主义自治共和国的领土，以终结围绕该地区的紧张局势。"
 BA_romania.2.d: "今日早些时候，我国驻[SOV.capital.GetCapitalVictoryPointName]的代表传回佳音：[FROM.GetNameDef]已同意割让[2038.GetName]，并解散此前组成摩尔达维亚苏维埃社会主义自治共和国的省份。"
 BA_romania_balkan_front.1.t: "[FROM.GetNameDefCap]重申他们对[2933.GetName]的主张"
 BA_romania_balkan_front.1.d: "尽管布加勒斯特政府在大战结束后随即放弃了其对西巴纳特的主张，但如今的新政权似乎另有打算。新政权现在反而重申对整个巴纳特的主张，包括位于我们边界内的[2933.GetName]。\n\n他们究竟是否会将这类主张付诸行动，尚不确定，但我们必须做好准备，以防他们试图夺取其所宣称的领土。"
 BA_romania_balkan_front.2.t: "[FROM.GetNameDefCap]重申他们对[631.GetName]的主张"
 BA_romania_balkan_front.2.d: "紧接大战结束之后，[FROM.GetNameDef]曾将其军队推进至布达佩斯城下，随后协约国列强命令他们撤退。在撤军的同时，协约国也撤回了对[FROM.GetAdjective]方面就[631.GetName]提出的任何领土主张的支持。\n\n然而，如今坐镇布加勒斯特的新政权，似乎要么已经忘记了那段历史，要么正选择对[631.GetName]提出一项新的主张；而据我们掌握的情报，他们正准备夺取该地，且最可能以武力方式实现。"
 ROM_sp_radar_tip_tt: "如果§Y专项计划$sp_air_radar$§!已完成，将在§Y[801.GetName]§!建造§Y1座雷达站§!。"
 ROM_harvest_state_46_tt: "-§Y[801.GetName]§!"
 ROM_harvest_state_79_tt: "-§Y[1594.GetName]§!"
 ROM_harvest_state_78_tt: "-§Y[1604.GetName]§!"
 ROM_harvest_state_81_tt: "-§Y[797.GetName]§!"
 ROM_DON_cores_tip_tt: "§Y哥萨克地区§!将获得以下省份的核心：§Y[511.GetName]§!、§Y[2392.GetName]§!、§Y[696.GetName]§!、§Y[2282.GetName]§!、§Y[732.GetName]§!"
 ROM_pressure_czechoslovakia: "要求[1437.owner.GetNonIdeologyName]做出让步"
 ROM_up_to_the_tisza_desc: "世界大战刚刚结束之际，我们曾被许诺获得直至蒂萨河的土地。然而，旧协约国背信弃义，迫使我方政府撤出 [631.GetName]。如今是时候纠正这一不公，夺回我们应得的土地了。"
 ROM_construct_the_bicaz_dam_desc: "在[1594.GetName]新规划的一座水坝项目，有望展现我们的工业实力。这座水坝产出的电力，必然能带动比卡兹周边的工业发展，支撑附近城镇的电气化建设，而规划中的人工湖还可以用于渔业生产，同时起到防洪的作用。"
 ROM_construct_the_traian_line_desc: "[SOV.GetAdjective]对[1604.GetName]的主张，已经让他们在[ROM.GetNameDef]最坚定的意识形态盟友，也对他们可能发起的侵略行动感到不安。如今他们的威胁正变得越来越切实，是时候投入资源落实防御措施了。"
