### BUL_free_balkan_states_ns_tt — single-key override: vanilla text re-used verbatim, only the consumer-goods figure fixed to the mod values (base -0.03 + -0.03 per guaranteed country, see history/countries/BUL - Bulgaria.txt:145, common/national_focus/bulgaria.txt:5823, common/dynamic_modifiers/0_dynamic_modifiers.txt:313). Stability/manpower wording is the inherited vanilla text and is left untouched. ###
 BUL_free_balkan_states_ns_tt: "\nПолучает национальный дух §YНаш долг на Балканах§!, дающий (фабрики, производящие товары народного потребления: §Y-3%§! базового значения и §Y-3%§! за каждую гарантируемую страну, стабильность: §G+5%§! за каждую гарантируемую страну, еженедельный прирост людских ресурсов: §G+1000§! вне зависимости от количества гарантируемых стран)."

