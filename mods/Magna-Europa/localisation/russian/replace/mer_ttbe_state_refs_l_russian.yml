l_russian:

# Remapped Vanilla state IDs in To The Bitter End loc keys -> Magna Europa state IDs
 BA_romania.1.d: "В 1924 году советские власти объявили о создании в регионе [2038.GetName], населённом преимущественно украинцами, Молдавской АССР. Тогда мы сразу поняли смысл этого замысла: оправдание претензий на [ROM.GetAdjRuLower]ую часть Молдавии. Сегодня эта история получила продолжение: [FROM.GetNameDef] требу[FROM.GetNameEndRuPresentEtYut] передать им нашу сторону того, что когда-то называлось Молдавской АССР, чтобы раз и навсегда положить конец прениям по поводу этой территории."
 BA_romania.2.d: "Наши представители в городе [SOV.capital.GetCapitalVictoryPointName] сообщают нам радостные новости: власти [FROM.GetNameRuGen] согласились расстаться с регионом [2038.GetName] и расформировать провинцию, которая когда-то была центром Молдавской АССР."
 BA_romania_balkan_front.1.t: "[FROM.GetNameDefCap] подтвержда[FROM.GetNameEndRuPresentEtYut] претензии на регион [2933.GetName]"
 BA_romania_balkan_front.1.d: "Несмотря на то, что правительство в Бухаресте сразу после Великой войны отказалось от своих претензий на Западный Банат, у нового режима, похоже, другие планы. Теперь ему нужен весь Банат, включая регион [2933.GetName], который находится в пределах наших границ.\n\nМы не знаем, последуют ли за этими разговорами какие-то действия, но на всякий случай нам лучше подготовиться."
 BA_romania_balkan_front.2.t: "[FROM.GetNameDefCap] подтвержда[FROM.GetNameEndRuPresentEtYut] претензии на регион [631.GetName]"
 BA_romania_balkan_front.2.d: "Сразу после окончания Великой войны [FROM.GetAdjRuLower]ие войска дошли до самого Будапешта, прежде чем Антанта приказала им отступить. Таким образом, союзные державы отказались поддерживать любые [FROM.GetAdjRuLower]ие притязания на регион [631.GetName].\n\nОднако новый бухарестский режим, похоже, забыл об этом и решил вновь предъявить претензии на регион [631.GetName]. По нашим сведениям, они готовятся захватить его — и, вероятнее всего, силой."
 ROM_sp_radar_tip_tt: "Если будет завершён §Yспециальный проект «$sp_air_radar$»§!, в регионе §Y[801.GetName]§! будет построена §Y1 радарная станция§!."
 ROM_harvest_state_46_tt: "• §Y[801.GetName]§!"
 ROM_harvest_state_79_tt: "• §Y[1594.GetName]§!"
 ROM_harvest_state_78_tt: "• §Y[1604.GetName]§!"
 ROM_harvest_state_81_tt: "• §Y[797.GetName]§!"
 ROM_DON_cores_tip_tt: "§YКазацкое государство§! будет считать национальными следующие регионы: §Y[511.GetName]§!, §Y[2392.GetName]§!, §Y[696.GetName]§!, §Y[2282.GetName]§!, §Y[732.GetName]§!"
 ROM_pressure_czechoslovakia: "Потребовать уступок от [1437.owner.GetNameRuGen]"
 ROM_up_to_the_tisza_desc: "Сразу после Великой войны нам обещали земли вплоть до самой Тисы, однако старая Антанта нанесла нам удар в спину и вынудила наше правительство оставить [631.GetName]. Пора исправить эту несправедливость и занять обещанные нам земли."
 ROM_construct_the_bicaz_dam_desc: "Недавно спроектированная плотина в регионе [1594.GetName] обещает стать символом нашей промышленной мощи. Производимое ей электричество поспособствует развитию промышленности в соседнем Биказе и электрификации окружающих городов, а запланированное искусственное озеро станет источником рыбы и снизит риск наводнений."
 ROM_construct_the_traian_line_desc: "[SOV.GetAdjective]ие претензии на регион [1604.GetName] вызвали даже у самых упорных идеологических сторонников [SOV.GetNameRuGen] в [ROM.GetNameRuPrep] опасения насчёт возможной агрессии со стороны этой державы. Теперь же [SOV.GetAdjRuLower]ая риторика становится всё более угрожающей, так что нам пора подумать о мерах обороны."
