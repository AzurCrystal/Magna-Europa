 assault_engineer:0 "Assault Engineer Company"
 assault_engineer_desc:0 "Specialized in breaching fortified positions, assault engineers combine explosives expertise with armored protection, ensuring mobility and fortification even in the most hostile environments."
 armored_engineer:0 "Armored Engineer Company"
 armored_engineer_desc:0 "Versatile vehicles equipped for constructing fortifications, clearing obstacles and enhancing battlefield mobility under combat conditions."
 armored_maintenance:0 "Armored Maintenance Company"
 armored_maintenance_desc:0 "Specialized vehicles designed to recover and repair damaged tanks and other armored units directly on the battlefield."
 armored_signal:0 "Armored Signal Company"
 armored_signal_desc:0 "Specialized vehicles providing battlefield leadership and coordination, equipped with advanced communication systems to direct operations from the front lines."
 motorized_military_police:0 "Motorized Military Police"
 motorized_military_police_desc:0 "Maintains order and suppresses resistance in occupied territories, and can perform reconnaissance in active combat zones."
 helicopter_recon:0 "Helicopter Recon"
 helicopter_recon_desc:0 "Specially trained observers mounted on helicopters, able to rapidly scout the area regardless of terrain, and call in precision strikes where needed."
 helicopter_transport:0 "Helicopter Transports"
 helicopter_transport_desc:0 "Helicopters with cargo capacity modifications or lifting supplies by cable beneath, getting equipment to where it needs to be quickly and without regard to terrain."
 helicopter_field_hospital:0 "Helicopter Med-Evac"
 helicopter_field_hospital_desc:0 "Attention all personnel! Incoming choppers with wounded! Med-Evac helicopters are able to get casualties off the battlefield far more quickly than a regular ambulance."
 helicopter_brigade:0 "Helicopter Brigade"
 helicopter_brigade_desc:0 "General purpose helicopter support brigade, able to provide flexible mobile assistance in a number of different areas."


