 rangers_support:0 "Recon Rangers"
 rangers_support_desc:0 "Recon Rangers are elite skirmish troops, specializing in infiltration, reconnaissance and close-quarters combat."
 ranger_battalion:0 "Rangers"
 ranger_battalion_desc:0 "Rangers are leading specialists when it comes to fighting in dense and vegetated terrain."
 rangers:0 "Rough Terrain Specialists"
 rangers_desc:0 "Specializing in infiltration and tactical awareness, we will benefit from accentuating the hostile environment training our Rangers receive."
 pioneer_support:0 "Pioneers"
 pioneer_support_desc:0 "Pioneers are talented engineers, adept at solidifying beachheads, general engineering projects, and consolidating gains."
 marines_shore_parties:0 "Shore Parties"
 marines_shore_parties_desc:0 "Often first into the breach at landings, shore parties are specialized groups of combat engineers with expertise in establishing a foothold under fire."
 marines_jungle_troops:0 "Jungle Specialists"
 marines_jungle_troops_desc:0 "Adept at clearing dense terrain, these marines excel at large scale offensive operations and engineering in rough terrain."
 marines_recon:0 "Gruelling Training Regimen"
 marines_recon_desc:0 "Nothing prepares a man for war, but our combat instructors assure us they can come close enough that only the most hardened recruits make it to where it counts."
 marines_commandoes:0 "Marine Commandos"
 marines_commandoes_desc:0 "Our marines have proven their worth at extended operations behind enemy lines. It is time we took the step of cementing this practice in our doctrine, and organizing the troops around effective hit-and-run behaviour."
 marines_expeditionary:0 "Expeditionary Units"
 marines_expeditionary_desc:0 "Coordinated strikes benefit from improved inter-disciplinary planning and logistics. As our doctrinal philosophy advances, lending greater support to these task forces is sure to benefit us."
 marines_expeditionary_blowtorch:0 "Blowtorch and Corkscrew"
 marines_expeditionary_blowtorch_desc:0 "The perfect combination of naval, air, and specialized land force can render any objective securable. This combined-arms approach to offensive warfare shall become the manifestation of our logistical prowess."
 marines_expeditionary_support:0 "Expeditionary Task Forces"
 marines_expeditionary_support_desc:0 "By now, the clear importance of branch cooperation is impossible to overstate. Dedicating task force logistics to our operations truly makes us a force to be reckoned with."
 marines_commandos_demolition:0 "Demolition Experts"
 marines_commandos_demolition_desc:0 "Demolition is an art that we can put to good use. Sabotage might be a dirty tactic, but there's no denying its efficacy."
 marines_commandoes_mechanised:0 "Mechanized Marine Corps"
 marines_commandoes_mechanised_desc:0 "The ability to consolidate upon a successful landing can only be enhanced by equipping our vanguard appropriately. This requires a shift in our production strategy as well as doctrine."
 category_amphibious_tanks:0 "Amphibious Armor"
