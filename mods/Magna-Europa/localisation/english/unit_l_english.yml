 light_armor:0 "Light Tank"
 light_armor_desc:0 "Lightly armored tanks."
 medium_armor:0 "Medium Tank"
 medium_armor_desc:0 "Medium tanks are flexible and can do almost any job."
 heavy_armor:0 "Heavy Tank"
 heavy_armor_desc:0 "The strongest tanks with powerful armor and weapons, but slow and tactically inflexible."
 super_heavy_armor:0 "Super-Heavy Tank"
 super_heavy_armor_desc: "Super-Heavy tanks trade mobility and speed for firepower and armor beyond that of the standard Heavy Tanks."
 motorized:0 "Motorized Infantry"
