 mechanized:0 "Mechanized Infantry"
 mechanized_desc:0 "Lightly armored infantry transportation."
 modern_armor:0 "Modern Tank"
 modern_armor_desc:0 "Modern Tanks have evolved to deal with most battlefield situations. Powerful guns and sloped armor have eliminated the need for specialized tanks."
 infantry:0 "Infantry"
 infantry_desc:0 "Meat for the meat grinder."
 bicycle_battalion:0 "Bicycle Battalion"
 bicycle_battalion_desc:0 "Meat for the meat grinder, but with extra bits of metal."
 paratrooper:0 "Paratroopers"
 paratrooper_desc:0 "By incorporating airborne forces into our army, we can make forced entries and position key troops in previously inaccessible areas, allowing for new tactical opportunities."
 marine:0 "Marines"
 marine_desc:0 "Troops specializing in amphibious warfare are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."
 marine_commando:0 "Marine Commandos"
 marine_commando_desc:0 "Troops specializing in amphibious raids are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."
 mountaineers:0 "Mountaineers"
 mountaineers_desc:0 "Combat in mountain ranges exposes troops to many perils, but sometimes cannot be avoided. By providing our soldiers with specialized training for this environment, we can minimize these risks."
 penal_battalion:0 "Penal Battalion"
 penal_battalion_desc:0 "The ultimate meat for the meat grinder."
 irregular_infantry:0 "Irregular Infantry"
 irregular_infantry_desc:0 "Armed local militia"
 militia:0 "Militia"
 militia_desc:0 "All-volunteer militias."
 blackshirt_assault_battalion:0 "Assault Battalion"
 blackshirt_assault_battalion_desc:0 "Elite militia units trained and equipped to operate as assault battalions attached to ordinary divisions."
 maritime_patrol_plane:0 "Naval Patrol Bomber"
 recon:0 "Cavalry Recon Detachment"
 recon_desc:0 "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing."
 mot_recon:0 "Motorized Recon Company"
 mot_recon_desc:0 "Utilizing light trucks and motorcycles, recon companies can range further ahead and cover more ground to protect the flanks."
 armored_car_recon:0 "Light Armored Recon Company"
 armored_car_recon_desc:0 "Equipped with armored cars, a recon company can take the fight to the enemy, and prevent enemy scouts from gaining any valuable information."
 light_tank_recon:0 "Armored Recon Company"
 light_tank_recon_desc:0 "Using light tanks in a recon role, we can conduct reconnaissance by fire and get a better understanding of what we are facing."
 armored_car:0 "Armored Car"
 armored_car_desc:0 ""
 engineer:0 "Engineer Company"
 engineer_desc:0 "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 field_hospital:0 "Field Hospital"
 field_hospital_desc:0 "Provides emergency medical attention to wounded soldiers in the field."
 logistics_company:0 "Logistics Company"
 logistics_company_desc:0 "Handles planning, requesting and distributing resources for the division."
 hq_support_company:0 "Headquarters Staff"
 hq_support_company_desc:0 "A dedicated headquarters staff company that administrates and assists with the unit's activities."
 hq_engineer:0 "Engineer Staff"
 hq_engineer_desc:0 "Deals with matters regarding fortifications and mobility/counter-mobility measures."
 hq_recon:0 "Reconnaissance Staff"
 hq_recon_desc:0 "Collects and analyzes reconnaissance data received from the field."
 hq_military_police:0 "Military Police Staff"
 hq_military_police_desc:0 "Maintains local order and directs division traffic across the army's area of operations."
 hq_maintenance:0 "Maintenance Planning Staff"
 hq_maintenance_desc:0 "Plans and supports maintenance & repair efforts on the army level."
 hq_field_hospital:0 "Hospital Group Staff"
 hq_field_hospital_desc:0 "Responsible for medical administration and providing efficient casualty evacuation and treatment within the army area."
 hq_logistics:0 "Logistics & Service Staff"
 hq_logistics_desc:0 "Prioritizes and allocates the distribution of supplies and fuel within the army."
 hq_signal:0 "Signal & Intelligence Staff"
 hq_signal_desc:0 "Coordinates communication efforts within the army, while also collecting and keeping track of gathered intelligence."
 hq_infantry:0 "Infantry HQ Security"
 hq_infantry_desc:0 "A smaller infantry battalion, dedicated towards HQ security."
 hq_motorized:0 "Motorized HQ Security"
 hq_motorized_desc:0 "Infantry in motorized vehicles, allowing more rapid relocation of the HQ."
 hq_armored_car: "Armored Car HQ Security"
 hq_armored_car_desc: "Armored cars escort the HQ, combining mobility with protection and excellent reconnaissance."
 hq_paratrooper:0 "Paratrooper HQ Security"
 hq_paratrooper_desc:0 "Allows an HQ to join an airborne invasion directly, along with providing additional security."
 hq_light_armor:0 "Light Armor HQ Security"
 hq_light_armor_desc:0 "Armored battalions lets the HQ unit move quicker on the field as well as survive longer in combat, if the circumstances require it."
 hq_medium_armor:0 "Medium Armor HQ Security"
 hq_medium_armor_desc:0 "Armored battalions lets the HQ unit move quicker on the field as well as survive longer in combat, if the circumstances require it."
