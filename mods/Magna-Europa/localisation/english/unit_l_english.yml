 super_heavy_artillery_desc:0 "A specialized unit equipped with large-caliber howitzers, designed to devastate enemy fortifications and entrenched positions."
 self_propelled_super_heavy_artillery:0 "Self-Propelled Super-Heavy Artillery"
 self_propelled_super_heavy_artillery_desc:0 "Massive-caliber howitzers, mounted on mobile chassis, combine devastating firepower with improved mobility to crush enemy defenses."
