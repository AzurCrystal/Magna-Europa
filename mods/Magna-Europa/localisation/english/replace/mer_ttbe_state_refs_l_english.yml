 ROM_DON_cores_tip_tt: "The §YCossack State§! will receive cores on the following states: §Y[511.GetName]§!, §Y[2392.GetName]§!, §Y[696.GetName]§!, §Y[2282.GetName]§!, §Y[732.GetName]§!"
 ROM_pressure_czechoslovakia: "Demand Concessions from [1437.owner.GetNonIdeologyName]"
 ROM_up_to_the_tisza_desc: "In the direct aftermath of the Great War, we were promised the lands all the way up to the Tisza River, however, after stabbing us in the back, the old Entente forced our government to withdraw from [631.GetName]. It is now time to rectify that and seize the land we were promised."
 ROM_construct_the_bicaz_dam_desc: "A newly envisioned dam project in [1594.GetName] promises to demonstrate our industrial power. The electricity production from the dam is sure to grow the industry of near Bicaz and accomodate electrification of the nearby towns, while its envisioned artificial lake will allow fishing and reduce flooding."
 ROM_construct_the_traian_line_desc: "The [SOV.GetAdjective] claims on [1604.GetName] have made even their staunchest ideological allies in [ROM.GetNameDef] nervous about the possibility of aggressive action from them. Now their threats are seeming increasingly serious, it is high time to invest in defensive measures."
