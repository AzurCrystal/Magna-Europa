l_english:

# Remapped Vanilla state IDs in To The Bitter End loc keys -> Magna Europa state IDs
 BA_romania.1.d: "Back in 1924, Soviet authorities formed a Moldovan ASSR in [2038.GetName], despite the region being prodominantly Ukrainian. This move, clearly aimed to justify claims over [ROM.GetAdjective] Moldova, has now lead [FROM.GetNameDef] to request our side of what was named the Moldovan ASSR to be ceded to them, ending the the tensions over it."
 BA_romania.2.d: "Positive news arrived earlier today from our representatives in [SOV.capital.GetCapitalVictoryPointName] as [FROM.GetNameDef] has accepted to cede [2038.GetName] and dissolve the province that previously formed the Moldovan ASSR."
 BA_romania_balkan_front.1.t: "[FROM.GetNameDefCap] Reaffirm Their Claims on [2933.GetName]"
 BA_romania_balkan_front.1.d: "Despite the government in Bucharest having renounced their claims on the state of West Banat, directly following the end of the Great War, it seems that the new regime has other plans. The new regime is now instead reaffirming their claim to all of Banat, including [2933.GetName] which resides within our borders.\n\nWhether or not they will actually act upon these claims or not, is uncertain, but we have to make preparations, should they try and take what they claim."
 BA_romania_balkan_front.2.t: "[FROM.GetNameDefCap] Reaffirm Their Claims on [631.GetName]"
 BA_romania_balkan_front.2.d: "Directly following the end of the Great War, [FROM.GetNameDef] advanced their armies up to the city of Budapest before the Entente powers ordered them to withdraw. When doing so, the allied powers also withdrew their support for any [FROM.GetAdjective] claims upon [631.GetName].\n\nHowever the new regime that now sits in Bucharest seems to either have forgotten that part of history, or are chosing to press a new claim upon [631.GetName], and from what we can gather, they are preparing to take it, most likely by force."
 ROM_sp_radar_tip_tt: "If §YSpecial Project $sp_air_radar$§! has been completed, §Y1 Radar Station§! will be built in §Y[801.GetName]§!. "
