 MA_germany.1.t:0 "Germany demands annexation"
 MA_germany.1.desc:0 "Germany has demanded the annexation of our proud country. If we were to accept these demands our glorious culture would be probably erased. We can try to make a last stand against the facist menace or surrenedr and be integrated into the German Reich. The choice is ours."
 MA_germany.1a:0 "Accept their demands"
 MA_germany.1a.t:0 "Liechentstein Folds"
 MA_germany.1a.desc:0 "The small state has accepted our demands, the integration process was swift and all their citiziens shall become Germans"
 MA_germany.1a.1:0 "Very Well"
 MA_germany.1b:0 "Never"
 MA_germany.1b.desc:0 "The filthy Liechtensteiner have refused our demands, they shall burn together with their Country"
 MA_germany.1b.t:0 "Liechentstein resists"
 MA_germany.1b.1:0 "Burn them to the Ground"