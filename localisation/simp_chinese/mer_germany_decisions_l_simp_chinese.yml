 GER_ultimatum_to_Danzig_desc:0 "向但泽自由市发出最后通牒，要求其回归帝国。若其接受，德国将吞并但泽；若拒绝，德国将获得针对但泽的战争目标。"
 danzig.1.t:0 "德国的最后通牒"
 danzig.1.d:0 "[GER.GetNameDefCap]已发出最后通牒，要求但泽自由市立即回归帝国。这座城市的居民与情感皆属德意志，与帝国统一不过是将既成事实正式化。然而，倘若拒绝，其后果恐怕是我们无法承受的。"
