 FRA_they_shall_not_pass:0 "他们休想通过！"
 FRA_they_shall_not_pass_desc:0 "法国人在大战中的英勇与坚韧——尤其是在凡尔登——至今仍铭刻在人们心中。这场战争不会与上一场有什么不同，我们将再次击退敌人。"
 IRE_free_state_idea:0 "《爱尔兰自由邦宪法》"
 IRE_free_state_idea_desc:0 "《爱尔兰自由邦宪法》（§CBunreacht Shaorstát Eireann§!）建立了一套以君主立宪为形式的议会制政府，并包含对若干基本权利的保障。宪法本意是成为一份刚性文件，在初始阶段之后只能通过全民公投加以修改。然而，宪法的修正程序后来被修改，使所有修正案实际上都可以通过议会（国会）的一纸简单法案通过。只要我们用对方法暗中运作，独立就触手可及。"
