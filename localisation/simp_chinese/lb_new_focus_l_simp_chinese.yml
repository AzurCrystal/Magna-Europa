 ROM_destroy_the_monarchy:0 "摧毁君主制"
 ITA_leone_del_sahara_re_tt:0 "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$：§G-5.0%§!\n"
 ITA_leone_del_sahara:0 "撒哈拉之狮"
 ITA_leone_del_sahara_desc:0 "在我们征服埃塞俄比亚期间，一位杰出的军官——早已因其在利比亚的行动被称为“撒哈拉之狮”——凭借在迈恩德和阿兹比的行动脱颖而出。他率领一支殖民军旅在绍阿与埃塞俄比亚游击队作战的表现，使我军高层普遍相信他或许能成为一名出色的殖民部队指挥官。"
 ITA_bop_ve3_commander:0 "授予维托里奥·埃马努埃莱三世野战指挥权"
 ITA_bop_ve3_commander_desc:0 "让国王更直接地指挥部队能对人民的士气产生积极影响，不过这也会增加萨伏依家族的影响力。"
 ITA_bop_ve3_abdicated_commander:0 "授予维托里奥·埃马努埃莱三世野战指挥权"
 ITA_bop_ve3_abdicated_commander_desc:0 "让退位国王更直接地指挥部队能对人民的士气产生积极影响，不过这也会增加萨伏依家族的影响力。"
 ITA_bop_promote_prince_umberto_fm:0 "擢升翁贝托亲王"
 ITA_bop_promote_prince_umberto_fm_desc:0 "擢升深受爱戴的翁贝托亲王无疑会提振我国人民的士气，不过也会增加萨伏依家族的影响力。"
 ITA_bop_promote_king_umberto_fm:0 "擢升翁贝托国王"
 ITA_bop_promote_king_umberto_fm_desc:0 "擢升翁贝托国王无疑会提振我国人民的士气，不过也会增加萨伏依家族的影响力。"
