 danzig.1.t:0 "German Ultimatum"
 danzig.1.d:0 "[GER.GetNameDefCap] has delivered an ultimatum demanding the immediate return of the Free City of Danzig to the Reich. The city is German in character and sentiment; reunification with the Reich would merely formalise an accomplished fact. Refusal, however, would invite consequences we may not survive."
