 danzig.1.b:0 "Defy the ultimatum"
 move_capital_to_constantinople:0 "Move Capital to Constantinople"
 move_capital_to_constantinople_desc:0 "Constantinople, the capital of the Second Hellenic Civilization, has been called 'the dream and hope of all Greeks' and the city of the world's desire. We can move our nation's capital to the old capital as a display of our rediscovered greatness."
