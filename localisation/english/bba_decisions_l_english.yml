############### African Union ################

 african_union_category: "Organization of African Unity"
 african_union_category_desc: "We will create institutions that pool the talents and resources of the entire continent together and move ever closer to political unification. Only by standing together and cooperating can the people of Africa hope to resist ending up as subjects once again."
 promote_org_of_african_unity: "Promote organization in [FROM.GetName]"
 invite_to_org: "Invite [FROM.OWNER.GetNameDef] to the Organization"
 invite_to_org_tt: "Nations with a different ideology to you will be less likely to accept membership offer."
 invite_to_ACB: "Invite [FROM.GetName] to African Central Bank"
 invite_to_ACB_tt: "Nations with a different ideology to you will be unlikely to accept economic integration with you."
 invite_to_org_alliance: "Invite [FROM.GetName] to Mutual Defense Agreement"
 invite_to_org_alliance_tt: "Nations with different ideology to you will be less likely to sign a defense agreement."
 invite_to_exec_council: "Invite [FROM.GetName] to Executive Council"
 invite_to_exec_council_tt: "Nations with different ideology will not support political unification with you."
 threaten_org_member: "Threaten [FROM.GetName]'s leadership"
 integrate_into_org: "Integrate [FROM.GetName] into African Union"
 leave_org_of_african_unity: "Leave the Organization of African Unity"
 threaten_member_state: "Intimidate [FROM.GetAdjective] leadership"
 threaten_member_state_desc: "We shall send a message to the leaders of [FROM.GetNameDef] that if they do not agree to deeper integration with the Organization of African Unity, there will be serious consequences to them personally..."
 threaten_member_state_tt: "\nThe leadership of the intimidated country will be more likely to accept integration proposals for the §G60 days§! this decision is active."

############################
########## ITALY ###########
############################

 ITA_withdraw_from_ethiopia: "Withdraw from Ethiopia"
 ITA_withdraw_from_ethiopia_desc: "The war against Ethiopia was a mistake, it is time to settle this controversial affair."
 ITA_transfer_lost_states_tt: "§Y[550.GetName]§!, §Y[559.GetName]§! and §Y[844.GetName]§! will be transferred to §Y[ETH.GetName]§! if they are fully controlled by them. §Y[908.GetName]§! will also be transferred if owned by [ROOT.GetNameDef]."

 ITA_missiolinis: "Missions from the Duce"
 ITA_missiolinis_desc: "The Duce has big plans to bring the proud Italian nation to its rightful place. To fulfill his vision of a greater Italy, he is issuing the pertinent orders that he trusts, will be carried out in a timely manner. \n\n£ITA_missiolini_text_icon Active missions: §Y[?ITA_missiolinis_active_missions]§! \n£ITA_missiolini_text_icon Successful missions: §Y[?ITA_missiolinis_successful_missions]§! \n£ITA_missiolini_silver_text_icon Failed missions: §R[?ITA_missiolinis_failed_missions]§!"
 ITA_missiolini_conquer_ethiopia: "Conquer Ethiopia"
 ITA_missiolini_conquer_ethiopia_desc: "Whatever Abyssinian strongholds that are still left need to be dealt with to secure an Italian victory."
 ITA_missiolini_pacify_ethiopia: "Pacify Ethiopia"
 ITA_missiolini_pacify_ethiopia_desc: "The Duce has given the order to crack down on Abyssinian opposition with brute force and to institute laws to keep the population in check. He wants the entire country pacified and brought into the Italian fold as soon as possible."
 ITA_missiolini_pacify_ethiopia_vanilla: "$ITA_missiolini_pacify_ethiopia$"
 ITA_missiolini_pacify_ethiopia_vanilla_desc: "$ITA_missiolini_pacify_ethiopia_desc$"
 ITA_pacify_ethiopia_goal_tt: "All initial Ethiopian states have greater Compliance than §Y60%§!"
 ITA_missiolini_strengthen_heavy_industry: "Industrialization Program"
 ITA_missiolini_strengthen_heavy_industry_desc: "For Italy to truly flourish, we need to built new factories to sustain the growth of our bustling empire and expand our production capabilities."
 ITA_missiolini_strengthen_heavy_industry_trigger_tt: "$TRIGGER_NUM_OF_CIVILIAN_FACTORIES_MORE_THAN$§Y[?ITA_missiolinis_required_civs]§!. (Currently §[GetColorNumOfCivsMissiolinis][?ROOT.num_of_civilian_factories]§!.)"
 ITA_missiolini_strengthen_the_army: "Strengthen the Army"
 ITA_missiolini_strengthen_the_army_desc: "Like the Roman Empire of old, our burgeoning empire is stretching far and wide and needs a strong army to protect it from the hordes of barbarians just beyond the borders."
 ITA_missiolini_stockpile_trucks: "Stockpile Trucks"
 ITA_missiolini_stockpile_trucks_desc: "We need a more mobile military force that can move fast over large swathes of terrain without having to be constrained by lagging logistics."
 ITA_missiolini_stockpile_fuel: "Increase Fuel Reserves"
 ITA_missiolini_stockpile_fuel_desc: "A modern army marches not only on its stomach but also on its fuel, and if there is none the entire war machine grinds to a halt. All branches of the military need it, and we must be able to provide gas in large quantities if we are to be successful on the battlefields."
 ITA_missiolini_strengthen_the_airforce: "Strengthen the Air Force"
 ITA_missiolini_strengthen_the_airforce_desc: "The Regia Aeronautica has become a symbol of national pride and was once one of the greatest air forces in the world. We need to produce additional aircraft to reinforce our air force and make it great again."
 ITA_missiolini_strengthen_the_airforce_fighters_goal_tt: "Has produced or acquired §Y[?ROOT.ITA_missiolinis_fighters_to_produce]§! new §Y$fighter_equipment$§! aircraft. \nCurrent Fighters deployed: §G[?ROOT.num_deployed_planes_with_type@small_plane_airframe]§! - Current Fighters in stockpile §G[?ROOT.num_equipment@small_plane_airframe]§! - Total Fighters Goal §Y[?ITA_missiolinis_fighters_goal]§! \n\n"
 ITA_missiolini_strengthen_the_airforce_bombers_goal_tt: "Has produced or acquired §Y[?ROOT.ITA_missiolinis_bombers_to_produce]§! new §Y$CAS_equipment$§!, §Y$nav_bomber_equipment$§! or §Y$tac_bomber_equipment$§! aircraft (only one type). \nCurrent CAS deployed: §G[?ROOT.num_deployed_planes_with_type@small_plane_cas_airframe]§! - Current CAS in stockpile §G[?ROOT.num_equipment@small_plane_cas_airframe]§! - Total CAS Goal §Y[?ITA_missiolinis_cas_goal]§! \nCurrent Naval Bombers deployed: §G[?ROOT.num_deployed_planes_with_type@small_plane_naval_bomber_airframe]§! - Current Naval Bombers in stockpile §G[?ROOT.num_equipment@small_plane_naval_bomber_airframe]§! - Total Naval Bombers Goal §Y[?ITA_missiolinis_naval_bombers_goal]§! \nCurrent Tactical Bombers deployed: §G[?ROOT.num_deployed_planes_with_type@medium_plane_airframe]§! - Current Tactical Bombers in stockpile §G[?ROOT.num_equipment@medium_plane_airframe]§! - Total Tactical Bombers Goal §Y[?ITA_missiolinis_tactical_bombers_goal]§!"
 ITA_missiolini_industrial_research: "Industrial Research"
 ITA_missiolini_industrial_research_desc: "We must show the world at what great speed fascism and the Italian people can accomplish great leaps in technology."
 ITA_missiolini_expand_intelligence_agency: "Expand Intelligence Service"
 ITA_missiolini_expand_intelligence_agency_desc: "By expanding our intelligence service we will infiltrate every aspect of Italian society to drag communists, criminals, and other harmful elements into the light and bring them to justice, making Italy more secure."
 ITA_missiolini_occupy_albania: "Occupy Albania"
 ITA_missiolini_occupy_albania_desc: "The strong ties between Italy and Albania go back millennia, to the Roman Empire. We must incorporate Albania into Italy to secure the inlet to the Adriatic Sea."
 ITA_missiolini_firmly_established_italian_administration_autonomy_text: "Firmly Established [ROOT.GetAdjective] Administration"
 ITA_missiolini_occupy_albania_occupation_effects: "If [ROOT.GetFlag][ROOT.GetNameDef] controls [ALB.GetFlag][ALB.GetAdjective] cores: \n"
 ITA_missiolini_occupy_albania_subject_effects: "If [ALB.GetFlag][ALB.GetNameDef] is a subject of §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_occupy_dalmatia: "Occupy Dalmatia"
 ITA_missiolini_occupy_dalmatia_desc: "We must correct a grave injustice from the Great War and take what rightfully belongs to us by force. Dalmatia must become Italian!"
 ITA_missiolini_occupy_dalmatia_occupation_effects: "\nIf [ROOT.GetFlag][ROOT.GetNameDef] controls §YDalmatia§!: \nEvery [YUG.GetFlag][YUG.GetAdjective] core state fully controlled by [ROOT.GetFlag][ROOT.GetNameDef]: \n   Compliance: §G+5.0%§!. \n   Resistance: §G-5.0%§!"
 ITA_missiolini_occupy_dalmatia_subject_effects: "\n If §Y[Dalmatia.GetName]§! is fully controlled by an [ROOT.GetAdjective] subject of [YUG.GetAdjective] origin: \n   All [ROOT.GetAdjective] subjects of [YUG.GetAdjective] origin: \n"
 ITA_missiolini_occupy_greece: "Occupy [GRE.GetName]"
 ITA_missiolini_occupy_greece_desc: "Like the Roman legions of old, we too can break the confinements put upon us by conquering Greece and unify our brotherly peoples."
 ITA_missiolini_occupy_greece_occupation_effects: "\nEvery [GRE.GetFlag][GRE.GetAdjective] core state fully controlled by [ROOT.GetFlag][ROOT.GetNameDef]: \n   Compliance: §G+5.0%§!. \n   Resistance: §G-5.0%§! \n\nCurrent effects:"
 ITA_missiolini_occupy_greece_subject_effects: "\nIf [GRE.GetFlag][GRE.GetName] is a subject of §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_occupy_ticino: "Occupy [708.GetName]"
 ITA_missiolini_occupy_ticino_desc: "Ever since Hannibal crossed the Alps with his elephants, the mountains have been a highway for barbarians straight into Italy’s heartlands. We must secure our northern border."
 ITA_missiolini_occupy_ticino_occupation_effects: "\n[708.GetName] and every [SWI.GetFlag][SWI.GetAdjective] core state fully controlled by [ROOT.GetFlag][ROOT.GetNameDef]: \n   Compliance: §G+5.0%§!. \n   Resistance: §G-5.0%§! \n\nCurrent effects:"
 ITA_missiolini_occupy_ticino_subject_effects: "\nIf [SWI.GetFlag][SWI.GetName] is a subject of §Y[ROOT.GetFlag][ROOT.GetNameDef]§!: \n"
 ITA_missiolini_bolster_political_cabinet: "Bolster Political Cabinet"
 ITA_missiolini_bolster_political_cabinet_desc: "Finding the right people for the right places is always hard to do. We cannot leave a stone unturned in our search for the smartest and brightest people."
 ITA_missiolini_bolster_political_cabinet_trigger_tt: "Has §Y3§! $political_advisor$s active, at least one of them being a §YHierarch§!"
 ITA_missiolini_bolster_military_high_command: "Bolster Military High Command"
 ITA_missiolini_bolster_military_high_command_desc: "Finding and promoting worthy candidates to the military high command will strengthen our strategic and tactical reasonings in upcoming conflicts."
 ITA_missiolini_bolster_military_high_command_trigger_tt: "Has §Y3§! $high_command$ advisors active"
 ITA_victory_in_ethiopia_flag: "Italian victory in Italo-Ethiopian war."

 ITA_balance_of_power_category: "$ITA_power_balance$"
 ITA_bop_take_over_ministry_of_foreign_affairs: "£BoP_right_texticon Take Over Ministry of Foreign Affairs"
 ITA_bop_take_over_ministry_of_foreign_affairs_desc: "Naming himself Minister of Foreign Affairs will let Benito Mussolini exert direct control over Italy’s foreign policies and relationships."
 ITA_bop_resign_ministry_of_foreign_affairs_position: "£BoP_left_texticon Resign Ministry of Foreign Affairs Position"
 ITA_bop_resign_ministry_of_foreign_affairs_position_desc: "Resigning from the position as Minister of Foreign Affairs will open it up to others, leaving Benito Mussolini in less control over Italy’s foreign policies and relationships."
 ITA_bop_take_over_ministry_of_justice: "£BoP_right_texticon Take Over Ministry of Justice"
 ITA_bop_take_over_ministry_of_justice_desc: "Naming himself Minister of Grace and Justice will let Benito Mussolini exert direct control over Italy’s justicial system and institutions."
