 ITA_2ndItaloEthiopianWar: "The League of Nations have so far failed to take action against us, only offering symbolic opposition to our conquest of Ethiopia. However, the longer the conflict drags out, and the more regular troops we commit, the greater the risk that they will actually start to meddle in our affairs. We must finish this war before [ETH.GetLeader] manages to convince the League of Nations to take action."


 ITA_conquer_the_north_mission: "Conquer Northern Ethiopia"
 ITA_conquer_the_north_mission_desc: "It is time to take back the ground we lost to the Ethiopians in their offensive."
 ITA_war_escalation_inc_tt: "War escalation increases by §R1§!"
 ITA_war_deescalation_inc_tt: "War escalation decreases by §G1§!"
 ITA_conquer_the_south_mission: "Conquer Southern Ethiopia"
 ITA_conquer_the_south_mission_desc: "The Ethiopians probably don't expect a push in the south. We must demoralize their army, and diminish their support in the League of Nations, by quickly capturing [837.GetName] and [836.GetName]."


