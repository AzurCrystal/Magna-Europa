 SWI_renounce_guiding_principles_desc_cantons: "Our original commitment to continue the devolution of power to the cantons and the Federal Assembly might have been premature. The current circumstances make it clear that a more energetic and empowered Federal Council is necessary for our survival."
 SWI_renounce_guiding_principles_desc_council: "Our original commitment to consolidate power into the Federal Council might have been misguided. The current situation call for a more direct and inclusive democracy, where stability and citizen participation are the order of the day."
