 SWI_federal_council_decisions_category_desc_dem: "The Federal Council of Switzerland has stood since 1848 as the stalwart zenith of Swiss Democracy. [SWI_get_temp_explanation_of_council_system]\n\n§YPresident of the Swiss Confederation:§! \n[SWI_GetPresidentName] \n\n§YLeading Councilors:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_fasc: "It may not be the same council of old but the new glorious regime lead by [SWI.GetLeader] still needs a strong council to enforce the will of the Führer in [?SWI.SWI_biggest_fascist.GetNameDef]. \n\n§YLeading Councilors:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_federal_council_decisions_category_desc_alt: "The leader of [SWI.GetNameDef], [SWI.GetLeader] cannot be expected to perform all the duties of a country with such an important mission, that is why [SWI.GetLeader.GetSheHe] must rely on a council to delegate some of the functions of the defunct Assembly. \n\n§YLeading Councilors:§! \n[SWI_GetCouncilor1name] \n[SWI_GetCouncilor2name] \n[SWI_GetCouncilor3name]"
 SWI_recently_finished_president_initiative: "Finished a Council Initiative recently"
 SWI_recently_finished_president_initiative_desc: "With the limited power of the Confederation President and the Federal Council, we must wait until another concerted initiative can be attempted. Granting the council more power might be the way to do more of these initiatives, but we must consider if that is the best course for Switzerland's deeply ingrained democratic values."
 SWI_defense_fund_drive: "Defense Fund Drive"
 SWI_defense_fund_drive_desc: "Defending against our potential invaders requires money that the Swiss Federal Government doesn't have, but we can campaign for the citizens of Switzerland to provide these funds, in a true bottom up initiative."
 SWI_swiss_democratic_tradition_campaign: "Swiss Democratic Tradition Campaign"
 SWI_swiss_democratic_tradition_campaign_desc: "We can remind the Swiss population of our storied democratic tradition, the oldest democracy in Europe, and perhaps the only true one."
 SWI_rally_workers: "Rally Workers"
 SWI_rally_workers_desc: "The workers could be an integral part of the defense of [SWI.GetName], so we can encourage their enthusiastic participation in the [SWI.GetAdjective] military industry and bear with the sacrifices needed."
 SWI_anti_fascist_drive: "Anti-fascist Drive"
 SWI_anti_fascist_drive_desc: "There's no place for fascists in [ROOT.GetName], as a country dedicated to self determination and local democratic power, and one that aspires to become a paradise for the people, it is our duty to get rid of every fascist still in the country, wherever they may be."
 SWI_spouse_fascism: "Spouse Fascist Ideals"
 SWI_spouse_fascism_desc: "The way things are going in the world, aligning ourselves to fascist powers might be the safest bet, we can start propagating fascist propaganda so the people can be ready for our realignment of values."
 SWI_focus_on_swiss_unity: "Focus on Swiss Unity"
 SWI_focus_on_swiss_unity_desc: "We can encourage the [SWI.GetAdjective] population that the situation calls for tossing aside our differences, in language, class, background and political leanings, to pool our resources and efforts on the defense of the unity and diversity that defines [SWI.GetNameDef]."
 SWI_isolate_switzerland: "Isolate Switzerland"
 SWI_isolate_switzerland_desc: "We can focus on doing everything we can to make sure [SWI.GetName] can stand alone and self-reliant, which might as well be our only chance to avoid losing our closely held independence."
 SWI_militarization_drive: "Militarization Drive"
 SWI_militarization_drive_desc: "We can shift our focus towards expanding the [SWI.GetAdjective] war machine so we can defend ourselves and maybe even take the initiative and pre-empt their offensives."
 SWI_expand_covert_operations: "Expand Covert Operations"
 SWI_expand_covert_operations_desc: "We can increase our espionage resources so we can influence world affairs in our favor while maintaining the semblance of neutrality."
 SWI_expand_arms_industry: "Expand Arms Industry"
 SWI_expand_arms_industry_desc: "We can increase our capacity to develop new weapons and produce them at a significant speed so we don't need to rely on foreign powers for our defense."
 SWI_support_humanitarian_efforts: "Support Humanitarian Efforts"
 SWI_support_humanitarian_efforts_desc: "We cannot sit on our hands while atrocities are committed around us. We have a moral obligation to help the oppressed of Europe and grant them asylum in our lands."
 SWI_diplomatic_mission: "Diplomatic Mission"
 SWI_diplomatic_mission_desc: "We can embark on diplomatic trips to other nations to have a closer relations with them, and placate any doubts they might have about our neutrality, avoiding any potential invasion from them."
 SWI_appease_fascists: "Appease Fascists"
 SWI_appease_fascists_desc: "We can accept the new European order and learn to coexist with our fascist neighbors. This could let us escape war, and secure our independence and neutrality."
