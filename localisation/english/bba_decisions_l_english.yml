# Decisions Menu
 war_escalation_text: "£generic_war_escalation_text_icon War Escalation Level: §Y[?ETH.ETH_war_escalation_level]§!"
 war_escalation_level_tt: "§YCurrent War Escalation§!\nEscalation Level increases over time, and also by various actions that Italy takes.\n\nWar Length: §Y+[?ETH.ETH_escalation_time_increase_total]§!\nItaly has launched major offensive (+1) [GetItalianRenewedOffensiveText]\n\nItaly has committed at least 25 regular divisions (+1) [GetItalian20DivisionsText]\n\nItaly has committed at least 300 aircraft (+1) [GetItalianAircraftsText] [GetDefendTheNorthMissionText][GetDefendTheSouthMissionText][GetDefendHararMissionText][GetDefendTheCapitalMissionText]"
 war_escalation_icon_tt: "§YWar Escalation§!\nEffects triggered by increasing war escalation, by level:\n Level 3:\n §YLeague of Nations§!: Request Embargo unlocked.\n §YEthiopia§!: International Reputation Grows \nLevel 4:\n §YLeague of Nations§!: Arms Purchases unlocked.\n §YItaly§!: Italian Public Concerned\nLevel 5:\n §YLeague of Nations§!: Closing the Suez unlocked.\n §YItaly§!: Army of Africa Disheartened\nLevel 6: \n §YLeague of Nations§!: International Brigades unlocked.\n §YEthiopia§!: Army Morale Boosted\n §YItaly§!: Unrest in the Colonies\nLevel 7: \n §YLeague of Nations§!: International Mediation unlocked.\n §YItaly§!: Italian Public Questions War Effort \nLevel 8:\n §YEthiopia§!: Enemy Desertions\n §YItaly§!: Mass Desertions \nLevel 9:\n §YEthiopia§!: Survival Against all Odds \nLevel 10:\n §YEthiopia§!: The People's War\n §YItaly§!: Uproar in the Colonies"
 war_escalation_1_tt: "Level 1\n No effects"
 war_escalation_2_tt: "Level 2\n No effects"
 war_escalation_3_tt: "Level 3\n §YLeague of Nations§!: Ethiopia may request embargo.\n §YEthiopia§!: International Reputation Grows, §YRequest Embargo§! focus unlocked."
 war_escalation_4_tt: "Level 4\n §YLeague of Nations§!: Ethiopia may request arms.\n §YItaly§!: Italian Public Concerned \n §YEthiopia§!: §YArms Purchases§! focus unlocked."
 war_escalation_5_tt: "Level 5\n §YLeague of Nations§!: Ethiopia may request Suez closure.\n §YItaly§!: Army of Africa Disheartened \n §YEthiopia§!: §YClosing the Suez§! focus unlocked"
 war_escalation_6_tt: "Level 6 \n §YLeague of Nations§!:Ethiopia may request international brigades.\n §YEthiopia§!: Army Morale Boosted, §YInternational Brigades§! focus unlocked.\n §YItaly§!: Unrest in the Colonies"
 war_escalation_7_tt: "Level 7\n §YLeague of Nations§!: Ethiopia may request international mediation.\n§Y Italy§!: Italian Public Questions War Effort \n§YEthiopia§!: §YInternational Mediation§! focus unlocked."
 war_escalation_8_tt: "Level 8\n §YEthiopia§!: Enemy Desertions\n §YItaly§!: Mass Desertions"
 war_escalation_9_tt: "Level 9\n §YEthiopia§!: Survival Against all Odds"
 war_escalation_10_tt: "Level 10\n §YEthiopia§!: The People's War\n §YItaly§!: Uproar in the Colonies"

