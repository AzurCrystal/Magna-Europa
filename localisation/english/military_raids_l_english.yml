 operation_jericho_failure_tt:0 "The Raid is a complete disaster, none of the prisoners manage to escape. Enemy control of the area increases"
 operation_jericho_limited_success_tt:0 "The daring bombing run manages to blow a hole in the prison wall. However, many of the prisoners are injured and or fail to escape."
 operation_jericho_success_tt:0 "The daring bombing run manages to blow a big hole in the prison wall. Some of the prisoners are injured or fail to escape, but a substantial number manage to escape, and are picked up by the local resistance."
 operation_jericho_critical_success_tt:0 "The daring bombing run manages to blow a huge hole in the prison wall without injuring any of the prisoners. Most prisoners manage to escape, and are picked up by the local resistance."

 operation_huansheng_failure_tt:0 "The Raid is a complete disaster, none of bombers reach their designated drop-zones, and many are shot down by naval air defenses."
 operation_huansheng_limited_success_tt:0 "The daring bombing run manages to deliver leaflets over most of the designated cities. However, most are scattered in inaccessible areas and quickly cleaned up by enemy forces."
 operation_huansheng_success_tt:0 "The daring bombing run manages to deliver leaflets over all of the designated cities. Some leaflets are scattered on roofs or in forested areas, but a majority of them land in accessible and populated areas, and are quickly picked up by local residents."
 operation_huansheng_critical_success_tt:0 "The daring bombing run manages to deliver leaflets over all of the designated cities. All of them land in accessible and populated areas, and are quickly picked up by local residents, spreading the news of the Japanese invasion far and wide."


