 raid_type_INS_militia_increase_activity_raid:0 "Attempt Guerilla Infiltration"
 raid_type_INS_militia_increase_activity_raid_desc:0 "We will send Militias to the state, where they will make contact with local revolutionaries and establish guerilla cells. If the operation goes smoothly, we will attempt to infiltrate the region and seize control from the Dutch.\n\n§WThe target state must be in range of a Republican-owned §YBunker§!, §YRailway§!, or §YNaval Base§!. These buildings can be used as starting points.§!\n\n§YEffects:§!\n§RAssigned division is expended§!\n§YSuccess:§!\n       §WBecomes owner and controller of the state\n       Increases escalation by §R1§!§!.\n§YLimited Success:§!\n       §W Adds §Yone tier§! of militia activity, increasing success chance for future attempts.§!\n§YFailure:§!\n       §WNo effects§!."
 #Naval
 raid_type_INS_militia_port_raid:0 "Occupy Naval Base"
 raid_type_INS_militia_port_raid_desc:0 "We will send militias disguised as fisherman on small boats that will hopefully not be located. They will attempt to establish guerilla cells upon landing, and will work with local guerillas to occupy the naval base if opportunity allows. This is a very risky endeavour, if the militias get spotted, the operation is sure to fail.\n\n§YEffects:§!\n§RAssigned division is expended§!\n§YSuccess:§!\n       §WBecomes owner and controller of the state\n       Increases escalation by §R1§!§!.\n§YLimited Success:§!\n       §W Adds §Yone tier§! of militia activity, increasing success chance for future attempts.§!\n§YFailure:§!\n       §WNo effects§!."

 SIA_pacific_island_raid:0 "Raid Pacific Island"
 SIA_pacific_island_raid_desc: "We will raid the pacific island and attempt to severely damage their naval buildings, ships and armies on it."
 raid_type_SIA_pacific_island_raid: "$SIA_pacific_island_raid$"
 raid_type_SIA_pacific_island_raid_desc: "$SIA_pacific_island_raid_desc$\n\n§YEffects:§!\n§YCritical Success / Success / Limited Success:§!\n       §WDamages the §Ynaval base§! and §Ynaval facility§! by §Y3§!/§Y2§!/§Y1§! levels\n       Damages enemy §Yarmies and ships§! in the state by §Y75%§!/§Y50%§!/§Y25%§!§!\n§YFailure:§!\n       §RAssigned division is destroyed§!"
 raid_type_SIA_indochina_port_raid: "Raid Indochinese Port"
 raid_type_SIA_indochina_port_raid_desc: "Our bombers will strike an enemy naval base in Indochina, cratering its wharves and sinking whatever gunboats lie at anchor. Every port we crater is one less base for the enemy fleet on the Gulf."
 
