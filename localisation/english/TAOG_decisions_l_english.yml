  SIA_implement_constitutionalist_reforms_countdown: "Implement Constitutionalist Reforms"
  SIA_seek_support_from_constitutional_monarchists_tt: "We will gain support from the Constitutional Monarchists.\n\nThey will help us in the civil war, spawning additional divisions. However they will expect us to remain a constitutional Monarchy, by completing the §Y$SIA_a_constitutional_monarchy$§! focus within §Y720 day(s)§! of gaining power.\n\nNot doing so will incur a hit to §YStability§! and §YWar Support§!"
  
  SIA_appeal_to_rural_people: "Appeal to the Rural People"
  SIA_appeal_to_rural_people_tt: "We will gain support from the Rural People.\n\nThey will help us in the civil war, granting militias. However they will expect us to pass beneficial agricultural policies in return, by completing either §Y$SIA_mechanization_of_agriculture$§! or §Y$SIA_reduction_of_agricultural_yield_taxes$§! focus within §Y720 day(s)§! of gaining power.\n\nNot doing so will incur a hit to §YStability§! and §YWar Support§!\n\nUpon the start of the civil War we will get: "
  SIA_implement_rural_reforms_countdown: "Implement Rural Reforms"

  SIA_implement_absolutist_reforms_countdown: "Implement Absolutist Reforms"  
  SIA_seek_support_from_absolutists_monarchists: "Seek support from the Absolutists Monarchists"
  SIA_seek_support_from_absolutists_monarchists_tt: "We will gain support from the Absolutists Monarchists.\n\nThey will help us in the civil war, spawning additional divisions. However they will expect us to return to absolute Monarchism, by completing the §Y$SIA_an_absolute_monarchy$§! focus within §Y720 day(s)§! of gaining power.\n\nNot doing so will incur a hit to §YStability§! and §YWar Support§!"

  SIA_appeal_to_navy_clique: "Appeal to the Navy Clique"
  SIA_appeal_to_navy_clique_countdown: "Implement Navy Reforms"
  SIA_appeal_to_navy_clique_tt: "We will gain support from the Navy Clique.\n\nThey will help us in the civil war, granting us our entire navy and a marine division. However they will expect us to pass beneficial naval policies, by completing the §Y$SIA_thonburi_class_coastal_defense_ship$§! focus within §Y720 day(s)§! of gaining power.\n\nNot doing so will incur a hit to §YStability§! and §YWar Support§!\n\nUpon the start of the civil War we will get:\n§YOur entire Navy§!\nThe §YRoyal Thai Marine Corps§! Marine division\nThe §YMarines§! technology"
  
  SIA_appeal_for_support_cat: "Appeal for Support"
  SIA_appeal_for_support_cat_desc: "No political movement succeeds alone. Monarchists, constitutionalists, soldiers and civilians each hold sway over a portion of the country. Their support must be cultivated carefully if we are to have the strength to act when the moment comes."
  SIA_demand_independence: "Demand Independence for §Y[FROM.GetName]§! from §Y[FROM.OVERLORD.GetNameDef]§!"  
  SIA_demand_independence_VIN: "Demand the release of §Y[VIN.GetName]§!"
  SIA_demand_independence_VIN_tt: "We will demand that the controllers of [VIN.GetName] set them free"
  SIA_demand_independence_LAO: "Demand the release of §Y[LAO.GetName]§!"
  SIA_demand_independence_LAO_tt: "We will demand that the controllers of [LAO.GetName] set them free"
  SIA_demand_independence_CAM: "Demand the release of §Y[CAM.GetName]§!"
  SIA_demand_independence_CAM_tt: "We will demand that the controllers of [CAM.GetName] set them free"
  SIA_invite_to_adc: "Invite §Y[FROM.GetName]§! to our faction"

  SIA_asian_democratic_compact_cat: "Asian Democratic Compact"
  SIA_asian_democratic_compact_cat_desc: "The peoples of Asia have the right to govern themselves. As the standard bearer of Asian self-determination, we can pressure the colonial powers to release the nations they hold."

  SIA_khana_ratsadon_cat: "The Khana Ratsadon"
  SIA_khana_ratsadon_cat_desc: "The Khana Ratsadon, the People's Party that ended the absolute monarchy, is not a monolith. Its military and civilian wings each have their own vision for the country, and the tension between them runs beneath the surface of every decision. Keep both factions satisfied, or risk the coalition tearing itself apart."

  SIA_army_navy_reform_cat: "Army and Navy"
  SIA_army_navy_reform_cat_desc: "The army and navy compete for the same limited pool of resources. Shifting funds between the two branches is a constant balancing act, with each reallocation carrying consequences for the other's readiness."
  SIA_divert_army_funds_to_navy_toggle: "[SIA_GetDivertingArmyFundsToNavyTitle]"
  SIA_divert_army_funds_to_navy_toggle_tt: "[SIA_GetDivertingArmyFundsToNavyTT]"
 SIA_divert_army_funds_to_navy_toggle_do:0 "Divert Army funds towards the Navy"
 SIA_divert_army_funds_to_navy_toggle_do_tt:0 "We shall divert some of our Army funds towards the Navy to hasten its development."
 SIA_divert_army_funds_to_navy_toggle_undo:0 "Stop diverting Army funds towards the Navy"
 SIA_divert_army_funds_to_navy_toggle_undo_tt:0 "We shall no longer divert some of our Army funds towards the Navy."

  SIA_standing_our_ground_mission: "Standing our Ground"
  SIA_standing_our_ground_mission_tt: "We must fight for our freedom."

  SIA_sway_generals_to_seri_thai_tt: "Generals we have swayed to the Seri Thai will join us when the civil war begins, instead of joining the loyalist revolt."
  SIA_sway_general_cw_scale_tt: "Increases our support in the civil war by §Y5%§!\nIf support is over §Y80%§! a civil war is avoided and we seize power uncontested"
  SIA_sway_luang_chawengsaksongkhram_to_seri_thai: "Sway Luang Chawengsaksongkhram"
  SIA_sway_luang_chawengsaksongkhram_to_seri_thai_desc: "Win Luang Chawengsaksongkhram over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_aditya_dibabha_to_seri_thai: "Sway Aditya Dibabha"
  SIA_sway_aditya_dibabha_to_seri_thai_desc: "Win Aditya Dibabha over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_mangkorn_phromyothi_to_seri_thai: "Sway Mangkorn Phromyothi"
  SIA_sway_mangkorn_phromyothi_to_seri_thai_desc: "Win Mangkorn Phromyothi over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_luang_haansongkhram_to_seri_thai: "Sway Luang Haansongkhram"
  SIA_sway_luang_haansongkhram_to_seri_thai_desc: "Win Luang Haansongkhram over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai: "Sway Charun Rattanakun Seriroengrit"
  SIA_sway_charun_rattanakun_seriroengrit_to_seri_thai_desc: "Win Charun Rattanakun Seriroengrit over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_phichit_kriangsakphichit_to_seri_thai: "Sway Phichit Kriangsakphichit"
  SIA_sway_phichit_kriangsakphichit_to_seri_thai_desc: "Win Phichit Kriangsakphichit over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_jira_wichitsongkhram_to_seri_thai: "Sway Jira Wichitsongkhram"
  SIA_sway_jira_wichitsongkhram_to_seri_thai_desc: "Win Jira Wichitsongkhram over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_phin_choonhavan_to_seri_thai: "Sway Phin Choonhavan"
  SIA_sway_phin_choonhavan_to_seri_thai_desc: "Win Phin Choonhavan over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."
  SIA_sway_tiang_sirikhan_to_seri_thai: "Sway Tiang Sirikhan"
  SIA_sway_tiang_sirikhan_to_seri_thai_desc: "Win Tiang Sirikhan over to the Seri Thai cause. If swayed, he will side with us when the civil war begins."

  SIA_khana_ratsadon_dummy_military: "Risk of Military Coup"
  SIA_khana_ratsadon_dummy_military_tt: "The Military will launch a coup if we antagonize them too much. To avoid a civil war we should not have §Y$idea_SIA_military_rebellious$§! for too long."
  SIA_khana_ratsadon_dummy_military_desc: "The military is a powerful clique of the Khana Ratsadon party. They will not approve of policies that they consider to work against their interests, but approve of things they see as pro-militarization of the country."
  SIA_khana_ratsadon_military_coup_mission: "The military is planning to oust the government!"
  SIA_khana_ratsadon_military_coup_mission_desc: "The military sees the current government policies as a threat to their interests. They are actively planning to unseat the government should their standing not increase."

  SIA_khana_ratsadon_dummy_civilian: "Risk of Civilian wing Coup"
  SIA_khana_ratsadon_dummy_civilian_tt: "The civilian wing will launch a coup if we antagonize them too much. To avoid a civil war we should not have §Y$idea_SIA_civilian_rebellious$§! for too long."
  SIA_khana_ratsadon_dummy_civilian_desc: "The civilian wing is a powerful clique of the Khana Ratsadon party. They will not approve of policies that they consider to work against their interests, but approve of things they see as pro-democratic, pro-civilian."
  SIA_khana_ratsadon_civilian_coup_mission: "The civilian wing is planning to oust the government!"
  SIA_khana_ratsadon_civilian_coup_mission_desc: "The civilian wing sees the current government policies as a threat to their interests. They are actively planning to unseat the government should their standing not increase."

  SIA_promote_civilian_wing: "Court the Civilian Wing"
  SIA_promote_civilian_wing_desc: "By throwing the weight of the government behind the civilian wing's agenda of land reform, the courts, and the constitution, we can win the gratitude of Pridi's faction. Such favoritism does not go unnoticed, however: the officer corps will sulk and the disruption to ordinary administration will cost us dearly while the dust settles."
  SIA_promote_military_wing: "Court the Military Wing"
  SIA_promote_military_wing_desc: "By indulging the officers' demands and parading the strength of the armed forces, we can win the favor of Phibun's faction. Such favoritism does not go unnoticed, however: the realignment throws the army's routine into disarray and the disruption to ordinary administration will cost us dearly while the dust settles. A blunt instrument, fit only for hauling the wing back from the brink of revolt."
  SIA_cultivate_civilian_wing: "Cultivate the Civilian Wing"
  SIA_cultivate_civilian_wing_desc: "The standing the Royal Palace Bureau Directive has won us with the establishment opens the door to a patient, sustained courtship of the civilian wing. There is no abrupt favoritism to provoke a backlash, only the slow, steady work of winning Pridi's faction over, one concession at a time. It is a long road, but it can be walked as far as we please."
  SIA_cultivate_military_wing: "Cultivate the Military Wing"
  SIA_cultivate_military_wing_desc: "The standing the Royal Palace Bureau Directive has won us with the establishment opens the door to a patient, sustained courtship of the military wing. There is no abrupt favoritism to provoke a backlash, only the slow, steady work of winning the officer corps over, one concession at a time. It is a long road, but it can be walked as far as we please."
  SIA_end_factionalism_mission: "Holding the Coalition Together"
  SIA_end_factionalism_mission_desc: "Both wings of the Khana Ratsadon stand fully behind the government. If we can keep them both at §GFull Support§! for §Y270§! days, the rivalry between them can be put to rest for good. Should either wing's enthusiasm waver, the effort must begin anew."

  

