  SIA_war_fervor_cat: "War Fervor"
  SIA_war_fervor_cat_desc: "The people's appetite for conflict must be carefully managed. Left unchecked, war fervor will turn inward — a government that stirs martial spirit without directing it risks becoming its next target."
  SIA_war_fervor_coup_dummy: "War Fervor Boiling Over"
  SIA_war_fervor_coup_dummy_desc: "If the people's appetite for war boils over without an outlet it will inevitably be redirected at us."
  SIA_urge_restraint: "Urge Restraint"
  SIA_war_fervor_coup: "Imminent Coup"
  SIA_modify_cultural_mandates: "Modifies $idea_SIA_thai_cultural_mandates$ by:"
  
  SIA_mandate_1: "Mandate One"
  SIA_mandate_1_desc: "The country, people and nationality are to be called Thai"
  SIA_mandate_1_tt: "§Y[THIS.GetName]§! will be known as §Y$SIA_thailand$§!"

  SIA_mandate_2: "Mandate Two"
  SIA_mandate_2_desc: "Thai people must not engage in any business without considering the benefit and safety of the nation\n\nThai people must never reveal anything to foreigners that might damage the nation. These actions are a betrayal of the nation\n\nThai people must not act as agent or spokesman for foreigners without considering the benefit of the Thai nation, and must not express opinion or take the side of foreigners in international disputes. These actions are a betrayal of the nation.\n\nThai people must not secretly purchase land on behalf of foreigners in a way that endangers the nation. These actions are a betrayal of the nation.\n\n When a person has betrayed the nation, it is the duty of Thai people to actively and quickly put a stop to it."

  SIA_mandate_3: "Mandate Three"
  SIA_mandate_3_desc: "Cease referring to Thai people inconsistently with the name of the nationality, or according to the preference of the group.\n\nUse the name 'Thai' to refer to all Thai people, without subdividing them."

  SIA_mandate_4: "Mandate Four"
  SIA_mandate_4_desc: "When seeing the national flag raised or lowered according to government custom, or hearing the sound of the salute bugle or whistle, or when the signal is given to raise or lower the flag, honor the flag according to regulation or custom.\n\nWhen the national anthem is heard, whether played for official purposes or as part of any kind of ceremony, participants or attendees will honor the anthem according to regulation or custom.\n\nWhen observing any person not paying proper respect as admonish them so as to see the importance of honoring the national flag, national anthem, and royal anthem."

  SIA_mandate_5: "Mandate Five"
  SIA_mandate_5_desc: "Thai people should make an effort to consume only food made from Thai products.\n\nThai people should make an effort to wear only clothes made from Thai products.\n\nThai people should support the agricultural, commercial, industrial, and other vocational efforts of fellow Thais.\n\nThai people should use and support any public utility established by the government or by Thai people.\n\nThai people practising agriculture, commerce, industry, or other vocation supported by this mandate must make an effort to maintain standards, improve quality, and run their business honestly."

  SIA_mandate_6: "Mandate Six"
  SIA_mandate_6_desc: "The music of the national anthem will be that written by Phra Chenduriyang, and on file at the Fine Arts Department\n\nThe lyrics of the national anthem will be those submitted by the army"

  SIA_mandate_7: "Mandate Seven"
  SIA_mandate_7_desc: "Every Thai person must help build the nation. Every able bodied person must work at a stable career. Any person without a career is unhelpful to the nation and is not deserving of respect from the Thai people."

  SIA_mandate_8: "Mandate Eight"
  SIA_mandate_8_desc: "On the royal anthem, we shall shorten the lyrics of the royal anthem, and replaced the word Siam with the word Thai"

  SIA_mandate_9: "Mandate Nine"
  SIA_mandate_9_desc: "Thai people must extol, honor and respect the Thai language, and must feel honored to speak it.\n\nThai people must consider it the duty of a good citizen to study the national language, and must at least be able to read and write; Thai people must also consider it their important duty to assist and support citizens who do not speak Thai or cannot read Thai to learn it.\n\nThai people must not consider place of birth, residence, or regional accent as a marker of division. Everyone must hold it to be true that all born as Thai people have the same Thai blood and speak the same Thai language. Place of birth or accent makes no difference.\n\nThai people must consider it their duty to conduct themselves as good Thai citizens should, and to urge and instruct those who do not yet know and understand their duty as to the duties of a good citizen of the Thai nation."

  SIA_mandate_10: "Mandate Ten"
  SIA_mandate_10_desc: "Thai people should not appear at public gatherings, in public places, or in city limits without being appropriately dressed. Inappropriate dress includes wearing only underpants, wearing no shirt, or wearing a wraparound cloth.\n\nAppropriate dress for Thai people consists of: Uniforms, as position and opportunity permits; Polite international style attire; Polite traditional attire."

  SIA_mandate_11: "Mandate Eleven"
  SIA_mandate_11_desc: "Thai people should divide their time into three portions. One for work, one for personal activities, and one for rest and sleeping. This should be orderly and follow a schedule until it becomes habitual.\n\nThai people should carry out their normal personal activities as follows: Eat meals at set times, no more than four daily; Sleep approximately 68 hours.\n\nThai people should faithfully perform work duties without discouragement or shirking. The midday rest and lunch period should be no longer than one hour. At the end of the working day, exercise by playing sports for at least one hour, or other activities such as gardening, caring for pets, or planting trees. Then, after showering, eat dinner.\n\nThai people should use their free time at night to complete necessary work, converse with family and friends, seek knowledge by listening to radio news or reading, or other entertainment or arts, as opportunity permits"

  SIA_mandate_12: "Mandate Twelve"
  SIA_mandate_12_desc: "In public places or roads, people should assist and protect children, the elderly, or the handicapped.\n\nWhoever follows item 1 is considered a cultured person deserving of the respect of the Thai people."  


  SIA_movie_theater_cat: "$SIA_sala_chaloem_thai_movie_theater$"
  SIA_movie_theater_cat_desc: "The silver screen is among the most powerful tools of the modern state. Through carefully chosen films and propaganda campaigns, the government can shape public opinion, stoke patriotism, and drown out dissenting voices."
