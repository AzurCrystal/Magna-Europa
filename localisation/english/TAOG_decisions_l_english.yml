 AST_training_camps_specialization:0 "Our training camps stand ready to offer specialist training to our troops, making them more effective in a variety of different theatres."

  # Formables
  AST_australasia_flag: "§YAustralasia§! has been formed"
  AST_australia_formables_category: "Australasia"
  AST_australia_formables_category_desc: "Although our roots always will bind us to the distant south, our arms have grown long and far-reaching, and made it no longer possible for others to sweep our views on world affairs under the rug. We have expanded, and may expand further still, and a new name for our nation shall make this clear. From the cocoon we emerge, spreading our wings for the world to admire and recognize, naming our colors and pattern the new nation down south—Australasia."
