  SIA_limited_war_cat: "Limited War"
  SIA_limited_war_cat_desc: "We cannot hope to overcome the great powers of the region in open war — not yet. By pressing our claims piece by piece, through carefully scoped campaigns, we chip away at their position while our own strength continues to grow."
  SIA_start_limited_war_indochina: "Start a Limited War in Indochina against [FROM.GetName]"
  SIA_start_limited_war_indochina_tt_main: "Starts a §YLimited War§! against §Y[FROM.GetName]§!.\nBy controlling all highlighted states belonging to §Y[FROM.GetName]§!, we will be able to take these states without escalating to a full scale war.\n§RLosing more than [?var:global.limited_war_surrender_threshold|%.0] surrender progress will lose us the limited war§!\n\n§RLosing the limited war might cause us to have to return previously conquered territories§!"
