  AST_kingdom_expansions_cat: "Kingdom Expansions"
  AST_new_zealand_and_clause_6: "New Zealand and Clause 6"
  AST_new_zealand_and_clause_6_desc: "During the process that united the Australian colonies into a federation, New Zealand ultimately decided not to take part. Ever since, however, the Constitution has continued to define New Zealand as one of Australia's potential states, and does allow for its admission.\n\nWith their national security now seriously threatened, New Zealand may, for the first time since the enactment of Clause 6, be swayed to join our Kingdom."
  AST_new_zealand_and_clause_6_tt: "(§Y[NZL.GetNameWithFlag]§!) Joins §Y[AST.GetNameDef]§!, bringing all of its territory and its land, naval, and air forces"
  AST_protector_of_the_indies: "Protector of the Indies"
  AST_protector_of_the_indies_desc: "Ever since conflict stirred in Europe, [HOL.GetNameDef] has been far too occupied by the defense of its own territory to care for the defense of its Indonesian colony. The potential fall of [INS.GetNameDef] may very well decide the fate of all other Southeast Asian nations, and cannot be left in the hands of the colony itself.\n\n[HOL.GetNameDefCap] understands too, considering the gravity of the situation, that the colony is better defended by [AST.GetNameDef]."
  AST_protector_of_the_indies_tt: "(§Y[INS.GetNameWithFlag]§!) Joins §Y[AST.GetNameDef]§!, bringing all of its territory and its land, naval, and air forces"
  AST_the_solomon_islands_protectorate: "The Solomon Islands Protectorate"
  AST_the_solomon_islands_protectorate_desc: "Ever since 1893, the Solomon Islands have been a protectorate. However, with war consuming its protector, it is doubtful how much protection the islands can truly expect.\n\n[AST.GetNameDefCap] shall seek to protect the islands itself, and surely it must be evident that a neighboring nation of Australia's stature is far better suited to such a task."
  AST_new_hebrides_and_caledonia_under_our_wing: "New Hebrides and Caledonia Under Our Wing"
  AST_new_hebrides_and_caledonia_under_our_wing_desc: "The island groups of the New Hebrides and New Caledonia have a long history of European occupation, just like Australia. Now that [AST.GetNameDef] at last has broken free from its settlers, it is in our royal responsibility to care for our surroundings, especially those belonging to peers with a background similar to ours.\n\nWith world tensions putting strain on the islands' occupier, it is finally possible to make them understand that the New Hebrides and New Caledonia would be safer within the realm of Australia."
  AST_rejects_request: "[FROM.GetNameWithFlag] Rejects following request:"

 AST_big_business_pact_cat:0 "Big Business Pact"
 AST_big_business_request_ongoing_flag:0 "Big Business Request §YOngoing§!"
 AST_naval_expansion:0 "$NOR_alt_dem_naval_expansion$"
  AST_naval_expansion_desc: "In exchange for the [ROOT.GetFascistParty] pursuing policies that benefit them, leading business figures have agreed to invest in industry reforms that align with the party's aims.\n\nThe fleet must be expanded if [AST.GetName] is to stand a chance against enemies of superior naval power. For a limited time, all hands shall be on deck in the dockyards, ensuring an increase in ship production."
 AST_factory_conversions:0 "Factory Conversions"
 AST_factory_conversions_desc:0 "In exchange for the [ROOT.GetFascistParty] pursuing policies that benefit them, leading business figures have agreed to invest in industry reforms that align with the party's aims.\n\nThe defense industry must be prioritized, and Australian factories must therefore be converted to support it."
 AST_land_development:0 "Land Development"
 AST_land_development_desc:0 "In exchange for the [ROOT.GetFascistParty] pursuing policies that benefit them, leading business figures have agreed to invest in industry reforms that align with the party's aims.\n\nToo much of [ROOT.GetName]'s territory remains unindustrialized and underdeveloped. By developing these regions, we will make them suitable for construction."
 AST_electrical_grid_expansions:0 "Electrical Grid Expansions"
 AST_electrical_grid_expansions_desc:0 "In exchange for the [ROOT.GetFascistParty] pursuing policies that benefit them, leading business figures have agreed to invest in industry reforms that align with the party's aims.\n\nBy expanding our electrical grid, we can promote domestic energy production that does not rely on imports."
 AST_factory_investments:0 "Factory Investments"
 AST_factory_investments_desc:0 "In exchange for the [ROOT.GetFascistParty] pursuing policies that benefit them, leading business figures have agreed to invest in industry reforms that align with the party's aims.\n\nIf we want to ensure that both military and civilian supplies remain sufficient in times of conflict, we need to expand our industrial capacity."

 AST_develop_port_kemla_steel_medium_decision:0 "Build Second Port Kembla Blast Furnace"
 AST_develop_port_kemla_steel_medium_decision_desc:0 "Port Kembla has functioned well with only one blast furnace, but demand has grown such that we may wish to build a second. This will roughly double the steel output of the region."
 AST_prospect_pilbara_iron_decision:0 "Open Pilbara Region to Mining"
 AST_prospect_pilbara_iron_decision_desc:0 "The Pilbara region has enormous reserves of iron ore, among the largest found in the world. However, in this extremely remote part of the country, the investment required to tap into this resource would be enormous... but then again so would the profits."
 AST_scale_up_pilbara_mines_steel_decision:0 "Scale Up Pilbara Mines"
 AST_scale_up_pilbara_mines_steel_decision_desc:0 "Now that the Pilbara region has been opened to large-scale mining, it's time to let the investment flow!"
 AST_pilbara_mining_tt:0 "Opening §Y$STATE_870$§! to further prospecting will enable a repeatable decision to increase steel production without limits."
 AST_scale_up_middleback_mines_steel_decision_1:0 "Expand the Iron Knob Mine"
 AST_scale_up_middleback_mines_steel_decision_1_desc:0 "Although the Iron Knob Mine has been active for a while, with expanding demand for iron ore, it's time to expand our efforts here."
 AST_scale_up_middleback_mines_steel_decision_2:0 "Open the Iron Monarch Mine"
 AST_scale_up_middleback_mines_steel_decision_2_desc:0 "The Iron Knob mine is not enough for our needs, thankfully the Middleback Mountains are rich in iron. It's time to establish our largest mine yet!"
 AST_scale_up_middleback_mines_steel_decision_3:0 "Open the Iron Prince Mine"
 AST_scale_up_middleback_mines_steel_decision_3_desc:0 "Wartime demands for metals are at an all time high, but the Middleback Mountains continue to provide."
 AST_expand_iron_mining_tt:0 "Having both §Y$AST_exports_for_economic_recovery$§!, and §Y$AST_within_reach$§! will enable exploitation of the Pilbara region of §Y$STATE_870$§!, unleashing a near inexhaustible source of §YSteel§!. We can use this to fuel our economy."
 AST_develop_port_kemla_steel_tt:0 "This will allow us to take the §YBuild Second Port Kemla Blast Furnace§! decision which will significantly boost our §YSteel§! output."
 AST_develop_middleback_tt:0 "This will unlock three decisions to develop our §YSteel§! production in §Y$STATE_519$§!"
  AST_expand_planned_extraction_pilbara_tt: "§Y$AST_planned_extraction$§! will enable exploitation of the Pilbara region of §Y$STATE_870$§!, unleashing a near inexhaustible source of §YSteel§!. We can use this to fuel our economy."

 AST_ireland_weapon_smuggling_cat:0 "Arming the Irish"
 AST_smuggle_arms_to_ireland:0 "Smuggle Arms to Ireland"
 AST_smuggle_arms_to_ireland_desc:0 "We must supply the Irish with the arms needed to fight the British."
 AST_smuggle_arms_to_ireland_ongoing_flag:0 "Arms Smuggling §YOngoing§!"
 AST_smuggle_arms_to_northern_ireland:0 "Smuggle Arms to Northern Ireland"
 AST_smuggle_arms_to_northern_ireland_desc:0 "If we can make Northern Ireland well-supplied enough with weapons, and well-connected enough with Ireland, then we can ensure that it can unite with Ireland before the British have the chance to intervene."
 AST_northern_ireland_rises_up:0 "Northern Ireland Uprising"

